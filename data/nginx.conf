upstream uvicorn {
    server sep:8003;  # `sep` is the service name defined in docker-compose.yml
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/localhost-cert.pem;
    ssl_certificate_key /etc/nginx/ssl/localhost-cert-key.pem;

    client_max_body_size 1m;

    location / {
        proxy_pass https://uvicorn;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;
        proxy_buffering off;
    }
}

server {
    listen 9999 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/localhost-cert.pem;
    ssl_certificate_key /etc/nginx/ssl/localhost-cert-key.pem;

    error_page 497 301 https://$host:$server_port$request_uri;

    location / {
        proxy_pass http://casdoor:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;
        proxy_buffering off;
    }
}
