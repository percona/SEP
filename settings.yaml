default:
  ALLOWED_HOSTS:
    - "localhost"
    - "127.0.0.1"
  AUTH_USER_MODEL: app.models.CasdoorUser
  ALLOW_CONCURRENT_SESSIONS: False
  SECRET_KEY: ""  # Auto-generated if empty
  LOGGING: WARNING  # LogLevel: DEBUG, INFO, WARNING, ERROR, CRITICAL
  SSL_CAFILE: null
  BASE_URL: null
  BACKEND_CORS_ORIGINS:
    - http://localhost:8000
    - http://127.0.0.1:8000
  CASDOOR:
    ENDPOINT: http://localhost:9999
    FRONT_ENDPOINT: //:9999
    ALLOWED_ISSUERS:
      - http://localhost:9999
      - http://127.0.0.1:9999
    CERTIFICATE_PATH: null  # Path to JWT key certificate
    APPLICATION_NAME: sep-app
  SEP:
    SNIPPETS:
      FILTER_EXTENSIONS:
        - .sh
    UVICORN_HOST: "127.0.0.1"
    UVICORN_PORT: 8000
    SSL_KEYFILE: null
    SSL_CERTFILE: null
    PROXY_HEADERS: False
    TEMPLATES_DIR: templates
    STATIC_DIR: static
    ALERT_DEFINITIONS_DIR: null
    OAUTH:
      REDIRECT_URI: /oauth/callback
    SESSION:
      COOKIE_NAME: casdoorToken
      SECURE: False
      HTTP_ONLY: True
      SAME_SITE: lax
      MAX_AGE: 3600
    PLUGINS:
      - NAME: Inventory
        MODULE_NAME: inventory
        URI_PATH: /inventory
        CSS_CLASS: inventory
      - NAME: Snippet Manager
        MODULE_NAME: snippets
        URI_PATH: /snippets
        CSS_CLASS: snippets
      - NAME: Collect Diagnostic Data
        MODULE_NAME: atw
        URI_PATH: /atw
        CSS_CLASS: atw
      - NAME: Schema Change
        MODULE_NAME: alters
        URI_PATH: /alters
        CSS_CLASS: alters
      - NAME: Archive
        MODULE_NAME: archives
        URI_PATH: /archives
        CSS_CLASS: archive
      - NAME: MySQL Backups
        MODULE_NAME: backup
        URI_PATH: /backups
        CSS_CLASS: backups
      - NAME: Checksums
        MODULE_NAME: checksums
        URI_PATH: /checksums
        CSS_CLASS: checksums
      - NAME: MongoDB Backups
        MODULE_NAME: backup_mongo
        URI_PATH: /backup_mongo
        CSS_CLASS: backup_mongo
      - NAME: Dipper Data Collection
        MODULE_NAME: dipper
        URI_PATH: /dipper
        CSS_CLASS: dipper
    DATABASE:
      ENGINE: sqlite  # Database engine: sqlite, mysql, postgresql
      USER: null
      PASSWORD: null
      HOST: ""  # Database host (empty string for SQLite to avoid URL construction issues)
      PORT: null
      NAME: sep.db
    PMM:
      ENDPOINT: https://127.0.0.1:8443
      VERIFY_SSL: true
      FRONTEND: null # Optional: PMM frontend URL for links
      EXECUTION_TARGET: null  # Optional: explicit Nomad node for PMM tasks
    SYNCERS:
      - SYNCER: PMMSyncer
      - SYNCER: MySQLSyncer
        IGNORE_SCHEMAS:
          - sys
          - performance_schema
          - mysql
          - information_schema
    SYNC_REFRESH_TIME: 5  # Browser refresh interval during sync (seconds)
  INVENTORY:
    SSL_KEYFILE: null
    SSL_CERTFILE: null
    DATABASE:
      ENGINE: sqlite
      USER: null
      PASSWORD: null
      HOST: ""  # Empty string for SQLite to avoid URL construction issues
      PORT: null
      NAME: inventory.db
  TASKS:
    SSL_KEYFILE: null
    SSL_CERTFILE: null
    DATABASE:
      ENGINE: sqlite
      USER: null
      PASSWORD: null
      HOST: ""  # Empty string for SQLite to avoid URL construction issues
      PORT: null
      NAME: tasks.db
    SYNC_LOCK_TTL: 300  # TaskHistory sync lock timeout (seconds)
    NOMAD:
      ENDPOINT: http://127.0.0.1:4646
      SECURE: False
      VERIFY_SSL: True
      SSL_KEYFILE: null
      SSL_CERTFILE: null
      SSL_CAFILE: null
      TIMEOUT: 10  # Request timeout in seconds
      MINIFY_PAYLOAD: True  # Minify payloads before dispatch
      LOG_SOCKET_READ_TIMEOUT: 10  # Socket read timeout for logs
    ANONYMIZER:
      DEFAULT_ENTITIES: "*"  # Default PII entities to anonymize

development:
  SEP:
    SNIPPETS:
      SYNC_INTERVAL: 60 seconds
      ENABLE_MANUAL_SYNC: true
    INVENTORY_ENDPOINT: http://localhost:8000/api/inventory
    TASKS_ENDPOINT: http://localhost:8000/api/tasks
    SECURITY_HEADERS:
      CONTENT_SECURITY_POLICY_EXCLUDE_PATHS:
        - /api/inventory/docs
        - /api/tasks/docs
    PLUGINS:
      - NAME: Task Manager
        MODULE_NAME: tasks
        URI_PATH: /tasks
        CSS_CLASS: tasks
    PMM:
      ENDPOINT: https://127.0.0.1:8443
      VERIFY_SSL: false
    SYNCERS:
      - SYNCER: PMMSyncer
      - SYNCER: MySQLSyncer
        IGNORE_SCHEMAS:
          - sys
          - performance_schema
          - mysql
          - information_schema
  CASDOOR:
    ORGANIZATION_NAME: built-in
  CELERY:
    BROKER_URL: "filesystem://"
    BROKER_TRANSPORT_OPTIONS:
      DATA_FOLDER_IN: data/celery/broker
      DATA_FOLDER_OUT: data/celery/broker
      PROCESSED_FOLDER: data/celery/processed
      CONTROL_FOLDER: data/celery/control
    RESULT_BACKEND: file://data/celery/results
    RESULT_PERSISTENT: True
    BEAT_DBURI: "sqlite:///schedule.db"
  ALERTING:
    SOURCE_SUFFIX: ":dev"

production_docker:
  ALLOW_CONCURRENT_SESSIONS: True
  ALLOWED_HOSTS:
    - "*"
  AUTH_USER_MODEL: app.models.CasdoorUser
  BACKEND_CORS_ORIGINS:
    - https://127.0.0.1:8444
  CASDOOR:
    ALLOWED_ISSUERS: '*'
    APPLICATION_NAME: sep-app
    CERTIFICATE_PATH: /data/certs/casdoor/sep_token_jwt_key.pem
    CLIENT_ID: redacted_match_casdoor_json
    CLIENT_SECRET: redacted_match_casdoor_json
    ENDPOINT: http://127.0.0.1:8000
    FRONT_ENDPOINT: //:9999
    ORGANIZATION_NAME: sep
  CELERY:
    BEAT_DBURI: postgresql://postgres:xxx@sep-db:5432
    BEAT_SCHEMA: sep
    BROKER_URL: redis://redis:6379/0
    WORKER_STATE_DB: celery_worker_state
  DATABASE:
    ENGINE: postgresql
    HOST: sep-db
    NAME: sep
    PASSWORD: xxx
    PORT: 5432
    USER: postgres
  INVENTORY:
    DATABASE:
      ENGINE: postgresql
      HOST: sep-db
      NAME: sep
      PASSWORD: xxx
      PORT: 5432
      USER: postgres
    SSL_CERTFILE: /data/certs/sep/inventory_api-cert.pem
    SSL_KEYFILE: /data/certs/sep/inventory_api-cert-key.pem
  SEP:
    DATABASE:
      ENGINE: postgresql
      HOST: sep-db
      NAME: sep
      PASSWORD: xxx
      PORT: 5432
      USER: postgres
    INVENTORY_ENDPOINT: https://127.0.0.1:9001
    OAUTH:
      REDIRECT_URI: /oauth/callback
    PROXY_HEADERS: True
    SSL_CERTFILE: /data/certs/sep/localhost-cert.pem
    SSL_KEYFILE: /data/certs/sep/localhost-cert-key.pem
    SECURITY_HEADERS:
      CONTENT_SECURITY_POLICY_EXCLUDE_PATHS:
        - /api/inventory/docs
        - /api/tasks/docs
    SESSION:
      COOKIE_NAME: casdoorToken
      SECURE: True
    PMM:
      ENDPOINT: https://127.0.0.1
      VERIFY_SSL: false
    SYNCERS:
      - SYNCER: PMMSyncer
      - SYNCER: MySQLSyncer
        IGNORE_SCHEMAS:
          - sys
          - performance_schema
          - mysql
          - information_schema
    TASKS_ENDPOINT: https://127.0.0.1:9002
  SSL_CAFILE: /data/certs/sep-ca.pem
  TASKS:
    DATABASE:
      ENGINE: postgresql
      HOST: sep-db
      NAME: sep
      PASSWORD: xxx
      PORT: 5432
      USER: postgres
    NOMAD:
      ENDPOINT: https://127.0.0.1:4647
      SECURE: False
      SSL_CAFILE: /data/certs/nomad/nomad-agent-ca.pem
      SSL_CERTFILE: /data/certs/nomad/global-client-nomad.pem
      SSL_KEYFILE: /data/certs/nomad/global-client-nomad-key.pem
    SSL_KEYFILE: /data/certs/sep/tasks_api-cert-key.pem
    SSL_CERTFILE: /data/certs/sep/tasks_api-cert.pem
