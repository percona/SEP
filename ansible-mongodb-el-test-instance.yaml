---
- name: Add Percona GPG RPM key
  ansible.builtin.rpm_key:
    key: 'https://repo.percona.com/yum/PERCONA-PACKAGING-KEY'
    state: present
  become: true
  tags:
    - sudo

- name: Install `percona-release`
  ansible.builtin.package:
    name: 'https://repo.percona.com/yum/percona-release-latest.noarch.rpm'
    state: present
  become: true
  tags:
    - sudo

- name: Enable Percona Distribution for MongoDB repo
  ansible.builtin.command: "percona-release setup -y pdmdb-7.0"
  become: true
  tags:
    - sudo

- name: Install Percona Distribution for MongoDB server
  ansible.builtin.package:
    name: percona-server-mongodb
    state: present
  become: true
  tags:
    - sudo
...
