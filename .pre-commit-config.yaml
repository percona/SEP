---
default_language_version:
  python: python3
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 871f3bcae4fe473cd7109c3a068db975dc035e3b  # 0.9.4
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/djlint/djLint
    rev: 9112cb64851c95a7802358af285d21ad8b7f6437  # v1.36.4
    hooks:
      - id: djlint
        types_or: [jinja]
      - id: djlint-reformat
        types_or: [jinja]
  - repo: https://github.com/google/addlicense
    rev: b289835c0741ba2fb92dd5f61af070e79c69a55e  # v1.2.0
    hooks:
      - id: addlicense
        args: ["-f", ".license_header", "-v"]
        types_or: [python, javascript, css, jinja]
        exclude: ^static/(js|css)/vendor/
  - repo: local
    hooks:
      - id: js-beautify
        name: JS Beautify
        description: "Run js-beautify (from jsbeautifier) on .js files"
        entry: js-beautify --end-with-newline --replace
        language: python
        additional_dependencies: ["jsbeautifier==1.15.1"]
        files: ^(?!.*\.min\.js$)(?!static/(js|css)/vendor/).*\.js$
      - id: css-beautify
        name: CSS Beautify
        description: "Run css-beautify (from cssbeautifier) on .css files"
        entry: css-beautify --end-with-newline --replace
        language: python
        additional_dependencies: ["cssbeautifier==1.15.1"]
        files: ^(?!.*\.min\.css$)(?!static/(js|css)/vendor/).*\.css$
      - id: update-installer-checksum
        name: Update sep_installer.sh checksum
        description: "Update sep_installer.sha256 when sep_installer.sh changes"
        entry: sh -c "sha256sum sep_installer.sh > sep_installer.sha256"
        language: system
        files: ^sep_installer\.sh$
        pass_filenames: false
      - id: changelog-fragments
        name: Validate changelog.d/ fragments
        description: "Validate per-PR changelog fragments under changelog.d/"
        entry: python3 scripts/changelog.py check
        language: system
        files: ^changelog\.d/
        pass_filenames: false
      - id: check-nomad-payload-size
        name: Check Nomad payload size
        description: "Ensure dispatch payloads stay under Nomad 16 KiB limit after minify+gzip"
        entry: python
        args:
          - -c
          - |
            import gzip, io, sys
            from python_minifier import minify
            NOMAD_PAYLOAD_SIZE_LIMIT = 16384
            failed = []
            for p in sys.argv[1:]:
                with open(p, encoding="utf-8") as f:
                    src = f.read()
                try:
                    src = minify(
                        src,
                        remove_annotations=True,
                        remove_pass=True,
                        remove_literal_statements=True,
                        combine_imports=True,
                        hoist_literals=True,
                        rename_locals=True,
                        rename_globals=True,
                        remove_object_base=True,
                        remove_asserts=True,
                        remove_debug=True,
                        remove_explicit_return_none=True,
                        remove_builtin_exception_brackets=True,
                    )
                except SyntaxError:
                    pass
                buf = io.BytesIO()
                with gzip.GzipFile(fileobj=buf, mode="wb") as gz:
                    gz.write(src.encode("utf-8"))
                sz = len(buf.getvalue())
                if sz > NOMAD_PAYLOAD_SIZE_LIMIT:
                    failed.append((p, sz))
            if failed:
                print("ERROR: Payload(s) exceed Nomad 16 KiB dispatch limit:")
                for p, sz in failed:
                    print(f"  {p}: {sz:,} bytes (limit: {NOMAD_PAYLOAD_SIZE_LIMIT:,})")
                sys.exit(1)
        language: python
        additional_dependencies: ["python-minifier==2.11.3"]
        files: ^app/sep/plugins/(?!dipper/)(?:.*/)?(?:payload|[^/]*_payload)$
        pass_filenames: true

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # v0.11.0.1
    hooks:
      - id: shellcheck
        types: [shell]
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 2a30809d16bc7a60d9b97353c797f42b510d3368  # v3.12.0-2
    hooks:
      - id: shfmt
        args: ["--diff", "--write", "--indent=4", "--case-indent", "--space-redirects", "--simplify"]
        types: [shell]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # v5.0.0
    hooks:
      - id: check-ast
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: fix-encoding-pragma
        args: ["--remove"]
      - id: trailing-whitespace
...
