---
default_language_version:
  python: python3
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 871f3bcae4fe473cd7109c3a068db975dc035e3b  # 0.9.4
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/djlint/djLint
    rev: 9112cb64851c95a7802358af285d21ad8b7f6437  # v1.36.4
    hooks:
      - id: djlint
        types_or: [jinja]
      - id: djlint-reformat
        types_or: [jinja]
  - repo: https://github.com/google/addlicense
    rev: b289835c0741ba2fb92dd5f61af070e79c69a55e  # v1.2.0
    hooks:
      - id: addlicense
        args: ["-f", ".license_header", "-v"]
        types_or: [python, javascript, css, jinja]
        exclude: ^static/(js|css)/vendor/
  - repo: local
    hooks:
      - id: js-beautify
        name: JS Beautify
        description: "Run js-beautify (from jsbeautifier) on .js files"
        entry: js-beautify --end-with-newline --replace
        language: python
        additional_dependencies: ["jsbeautifier==1.15.1"]
        files: ^(?!.*\.min\.js$)(?!static/(js|css)/vendor/).*\.js$
      - id: css-beautify
        name: CSS Beautify
        description: "Run css-beautify (from cssbeautifier) on .css files"
        entry: css-beautify --end-with-newline --replace
        language: python
        additional_dependencies: ["cssbeautifier==1.15.1"]
        files: ^(?!.*\.min\.css$)(?!static/(js|css)/vendor/).*\.css$
      - id: update-installer-checksum
        name: Update sep_installer.sh checksum
        description: "Update sep_installer.sha256 when sep_installer.sh changes"
        entry: sh -c "sha256sum sep_installer.sh > sep_installer.sha256"
        language: system
        files: ^sep_installer\.sh$
        pass_filenames: false
      - id: oxfmt
        name: oxfmt (frontend formatter)
        description: "Format frontend code with oxfmt (Prettier-compatible)"
        entry: sh -c 'cd frontend && pnpm exec oxfmt --write .'
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx|mjs|cjs|json|yaml|yml|md|css|scss)$
        exclude: ^frontend/(node_modules|.*/dist)/
        pass_filenames: false
      - id: oxlint
        name: oxlint (frontend linter)
        description: "Lint frontend code with oxlint"
        entry: sh -c 'cd frontend && pnpm exec oxlint --config oxlintrc.json --fix .'
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx|mjs|cjs)$
        exclude: ^frontend/(node_modules|.*/dist)/
        pass_filenames: false

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # v0.11.0.1
    hooks:
      - id: shellcheck
        types: [shell]
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 2a30809d16bc7a60d9b97353c797f42b510d3368  # v3.12.0-2
    hooks:
      - id: shfmt
        args: ["--diff", "--write", "--indent=4", "--case-indent", "--space-redirects", "--simplify"]
        types: [shell]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # v5.0.0
    hooks:
      - id: check-ast
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: fix-encoding-pragma
        args: ["--remove"]
      - id: trailing-whitespace
...
