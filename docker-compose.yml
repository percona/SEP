services:
  casdoor:
    image: casbin/casdoor-all-in-one
    volumes:
      - casdoor-data:/var/lib/mysql:z,rw
    ports:
      - "9999:8000"

  inventory_api:
    build: .
    command: poetry run python -m app.inventory.main --logging=debug
    volumes:
      - .:/app
    expose:
      - 8001
    depends_on:
      - casdoor
    environment:
      - FASTAPI_ENV=production_docker
    extra_hosts:
      - "host.docker.internal:host-gateway"

  tasks_api:
    build: .
    command: poetry run python -m app.tasks.main --logging=debug
    volumes:
      - .:/app
    expose:
      - 8002
    depends_on:
      - casdoor
    environment:
      - FASTAPI_ENV=production_docker
    extra_hosts:
      - "host.docker.internal:host-gateway"

  sep:
    build: .
    entrypoint: /app/entrypoint.sh
    volumes:
      - .:/app
    expose:
      - 8003
    depends_on:
      - inventory_api
      - tasks_api
      - casdoor
    environment:
      - FASTAPI_ENV=production_docker
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./data/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - sep

volumes:
  casdoor-data:


