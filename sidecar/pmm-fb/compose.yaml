# PMM + SEP feature-build topology (branch `pmm`).
#
# pmm-server is the PMM feature build carrying the SEP frontend and the
# PMM_ENABLE_SEP PostgreSQL exposure (Percona-Lab/pmm-submodules#4500 =
# percona/pmm branch PMM-15216, PRs #5653 + #5700): its entrypoint provisions
# the network-reachable low-privilege `sep` role and `sep` database.
#
# sep-sidecar is the app-restricted consolidated side-car, built on main by
# `make image-sidecar-embedded` and published under an `-embedded` suffix
# (apps: inventory, mysql_backups, atw; supervisord running the three APIs +
# Celery worker/beat + bundled Valkey; builtin snippets ingested at boot, no
# snippets management UI). Pin the `-embedded` tag — see pmm-fb/README.md
# "Which image to pin"; the plain tag is the standalone image.
#
# Run ./bootstrap.sh first: it generates the .env this file interpolates and
# renders pmm.conf from its committed template. pmm.conf overlays the stock
# nginx config so the five SEP path prefixes the PMM UI expects (/api,
# /sep_app, /stream-logs, /execution-events, /files) reach the side-car; see
# pmm.conf.template for the interim auth (Option D) wiring. SEP's own settings
# come from the profile baked into the image, with the per-deployment values
# below overriding it — environment outranks the file.
#
# sep-mysql is the task-execution target, behind the `mysql` profile; see
# mysql-target.md.
#
# The side-car gets a fixed IP because nginx resolves proxy targets at
# startup, when the SEP container may not be running yet — and a name-based
# upstream would also go stale when sep-sidecar is recreated (e.g. after
# minting the Grafana token, which now takes a recreate rather than a restart
# because the token reaches the process as environment). pmm.conf proxies to
# that IP.
#
# No per-deployment credentials are committed: bootstrap.sh generates those
# into the gitignored .env and pmm.conf; see README.md. The one credential
# spelled out below is PMM's stock admin:admin, which the feature build ships.

name: sep-pmm-fb

# Registered into PMM inventory and bound on the container — SEP hands the
# registered address to Mydumper, so the two must not drift
x-sep-mysql-address: &sep_mysql_address 172.28.9.40

services:
  pmm-server:
    # Default repeated on sep-mysql's PMM_FB_TAG build arg — a repin edits both
    image: docker.io/perconalab/pmm-server-fb:${PMM_FB_TAG:-PR-4500-133001e}
    environment:
      PMM_ENABLE_SEP: "1"
      PMM_SEP_POSTGRES_PASSWORD: ${SEP_PG_PASSWORD:?run ./bootstrap.sh first}
      PMM_ENABLE_NOMAD: "1" # SEP task execution runs through PMM's embedded Nomad…
      PMM_PUBLIC_ADDRESS: pmm-server # …which silently refuses to start without a public address
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - pmm-data:/srv
      - ./pmm.conf:/etc/nginx/conf.d/pmm.conf:ro
    networks:
      sep-pmm:
        ipv4_address: 172.28.9.2

  sep-sidecar:
    # The app-restricted image, built by main's image-sidecar-embedded target.
    # Track the -embedded suffix: the plain tag is the standalone image, which
    # has no supervisord and will not come up here. See README.md "Which image
    # to pin".
    image: docker.io/percona/percona-sep:pmm-272c0f0-embedded
    depends_on: [pmm-server]
    environment:
      SECRET_KEY: ${SEP_SECRET_KEY:?run ./bootstrap.sh first}
      SEP_DB_PASSWORD: ${SEP_PG_PASSWORD:?run ./bootstrap.sh first}
      SEP_INTERNAL_TOKEN: ${SEP_INTERNAL_TOKEN:?run ./bootstrap.sh first}
      # Empty until ./mint-grafana-token.sh runs; settings-env.sh tests -n, so
      # empty leaves the profile's inert token in place
      SEP_GRAFANA_TOKEN: ${SEP_GRAFANA_TOKEN:-}
      # The baked profile's endpoint is deliberately credential-free; the
      # harness is where PMM's admin:admin belongs
      SEP_NOMAD_ENDPOINT: https://admin:admin@pmm-server:8443/nomad
      BASE_URL: http://sep-sidecar:9000
    ports:
      - "127.0.0.1:9000:9000" # sep API (direct host access for probing)
      - "127.0.0.1:9001:9001" # inventory API
      - "127.0.0.1:9002:9002" # tasks API
    networks:
      sep-pmm:
        ipv4_address: 172.28.9.30

  sep-mysql:
    profiles: ["mysql"]
    build:
      context: .
      dockerfile: Containerfile.mysql
      args:
        PMM_FB_TAG: ${PMM_FB_TAG:-PR-4500-133001e}
    # Waiting for readyz only gets registration close: pmm-managed starts
    # answering later still, which the entrypoint's bounded retry covers
    depends_on:
      pmm-server:
        condition: service_healthy
    hostname: sep-mysql
    environment:
      SEP_MYSQL_ROOT_PASSWORD: ${SEP_MYSQL_ROOT_PASSWORD:?run ./bootstrap.sh first}
      SEP_MYSQL_BACKUP_PASSWORD: ${SEP_MYSQL_BACKUP_PASSWORD:?run ./bootstrap.sh first}
      SEP_MYSQL_PMM_PASSWORD: ${SEP_MYSQL_PMM_PASSWORD:?run ./bootstrap.sh first}
      PMM_AGENT_SERVER_ADDRESS: pmm-server:8443
      PMM_AGENT_SERVER_USERNAME: admin
      PMM_AGENT_SERVER_PASSWORD: admin
      PMM_AGENT_SERVER_INSECURE_TLS: "1"
      PMM_AGENT_CONFIG_FILE: /usr/local/percona/pmm/config/pmm-agent.yaml
      PMM_AGENT_SETUP_NODE_NAME: sep-mysql
      PMM_AGENT_SETUP_NODE_ADDRESS: *sep_mysql_address
      PMM_AGENT_SETUP_NODE_TYPE: container
      PMM_AGENT_PATHS_NOMAD_DATA_DIR: /var/lib/nomad
    # Nomad's client fingerprinter needs cgroup control, and raw_exec places its
    # tasks into cgroups the client creates. Measured on this topology, and a
    # harness-only concession — the side-car topology needs neither.
    privileged: true
    cgroup: host
    volumes:
      - sep-mysql-data:/var/lib/mysql
      # Keeping pmm-agent.yaml off the image layer keeps the node and service
      # ids stable across a recreate; SEP matches inventory nodes by external
      # id, so churning them orphans catalogued backup rows
      - sep-mysql-pmm-config:/usr/local/percona/pmm/config
      - sep-mysql-nomad:/var/lib/nomad
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    networks:
      sep-pmm:
        ipv4_address: *sep_mysql_address

networks:
  sep-pmm:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.9.0/24

volumes:
  pmm-data:
  sep-mysql-data:
  sep-mysql-pmm-config:
  sep-mysql-nomad:
