; Consolidated SEP side-car: the five SEP processes plus the bundled Valkey
; broker under one PID 1. Runs as uid 1001 (sep); sock/pid under /tmp rather
; than the app dir, which holds only read-only shipped files and mounted
; artifact volumes. All program output streams to the container stdout so
; `docker logs` is the single captured stream.

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; --- Broker (starts first) -------------------------------------------------
; Settings come from the config file entrypoint.sh generates rather than from
; flags, because it carries the requirepass credential and argv is readable by
; every process in the container's PID namespace. Supervisord's %(ENV_...)s
; expansion would put it straight back into argv.
[program:valkey]
command=valkey-server /tmp/valkey.conf
priority=5
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; --- Schema one-shots -------------------------------------------------------
; No depends_on in supervisord: each waits for its own store, runs once, ends
; EXITED. A failed run also ends EXITED (startsecs=0 makes FATAL unreachable),
; so success is published as a sentinel file -- asserted by healthcheck.sh, and
; waited on by the wait_for_schema.sh gate every API program runs.
; Each runs under `sh -c`, so signals go to the process group -- otherwise a
; stop reaches only the wrapper and orphans the wait loop or the upgrade.
; entrypoint.sh clears every sentinel before any of these is spawned, which is
; the only point strictly ahead of the programs gated on them.
[program:migrate-sep]
command=sh -c 'rm -f /tmp/migrate-sep.ok; until nc -z %(ENV_SEP_DB_HOST)s %(ENV_SEP_DB_PORT)s; do echo "[migrate-sep] waiting for postgres %(ENV_SEP_DB_HOST)s:%(ENV_SEP_DB_PORT)s"; sleep 1; done; alembic --name=sep upgrade heads && touch /tmp/migrate-sep.ok'
directory=/home/sep/app
priority=10
startsecs=0
autorestart=false
exitcodes=0
startretries=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:migrate-inventory]
command=sh -c 'rm -f /tmp/migrate-inventory.ok; until nc -z %(ENV_SEP_DB_HOST)s %(ENV_SEP_DB_PORT)s; do echo "[migrate-inventory] waiting for postgres %(ENV_SEP_DB_HOST)s:%(ENV_SEP_DB_PORT)s"; sleep 1; done; alembic --name=inventory upgrade heads && touch /tmp/migrate-inventory.ok'
directory=/home/sep/app
priority=10
startsecs=0
autorestart=false
exitcodes=0
startretries=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:migrate-tasks]
command=sh -c 'rm -f /tmp/migrate-tasks.ok; until nc -z %(ENV_SEP_DB_HOST)s %(ENV_SEP_DB_PORT)s; do echo "[migrate-tasks] waiting for postgres %(ENV_SEP_DB_HOST)s:%(ENV_SEP_DB_PORT)s"; sleep 1; done; alembic --name=tasks upgrade heads && touch /tmp/migrate-tasks.ok'
directory=/home/sep/app
priority=10
startsecs=0
autorestart=false
exitcodes=0
startretries=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; The beat schedule tables belong to sqlalchemy_celery_beat -- no revision in any
; of the three alembic tracks creates them -- and until this step existed their
; only creator was celery-beat, which starts behind the very APIs that read them.
; This drives the library's own prepare_models, so the tables stay its to define.
;
; Alone among the four it carries no `until nc -z` loop, and the asymmetry is
; deliberate: CELERY__BEAT_DBURI is a documented input for pointing beat at a
; store other than the SEP database, which is the only host the loop can name.
; Readiness therefore lives in the bootstrap, keyed on the URL it actually dials,
; and is unbounded exactly as those loops are -- autorestart=false means a step
; that gave up could never publish its sentinel, stranding every gated program.
[program:migrate-beat]
command=sh -c 'rm -f /tmp/migrate-beat.ok; python -m app.core.celery.bootstrap && touch /tmp/migrate-beat.ok'
directory=/home/sep/app
priority=10
startsecs=0
autorestart=false
exitcodes=0
startretries=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; --- API services, gated on the schema one-shots -----------------------------
; Each waits for all four sentinels before exec'ing its app, joined with `&&` so
; an exhausted gate never starts an app against tables nothing created. The gate
; is uniform even though inventory reads no beat table: container health already
; requires all three APIs to answer, so partial availability buys nothing, and a
; uniform rule cannot drift out of step with which service seeds what.
;
; startsecs=8 / startretries=30 are kept but no longer cover the schema race the
; gate now closes: they cover a transient failure after it. A schema step that
; genuinely failed leaves its sentinel unwritten, which healthcheck.sh reports.
;
; A program still inside its gate reports RUNNING, so healthcheck.sh's RUNNING
; assertion is weaker than it reads -- its HTTP probe is what keeps a healthy
; container meaning the APIs answer.
[program:sep]
command=sh -c './wait_for_schema.sh sep inventory tasks beat && exec python -m app.sep.main'
directory=/home/sep/app
priority=20
autorestart=true
startsecs=8
startretries=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:inventory]
command=sh -c './wait_for_schema.sh sep inventory tasks beat && exec python -m app.inventory.main'
directory=/home/sep/app
priority=20
autorestart=true
startsecs=8
startretries=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:tasks]
command=sh -c './wait_for_schema.sh sep inventory tasks beat && exec python -m app.tasks.main'
directory=/home/sep/app
priority=20
autorestart=true
startsecs=8
startretries=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; --- Celery worker + beat ---------------------------------------------------
[program:celery-worker]
command=celery -A app.celery worker --loglevel=info
directory=/home/sep/app
priority=30
autorestart=true
startsecs=8
startretries=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Beat is gated on the APIs, the worker is not. Priority orders the spawn calls
; only -- with no depends_on, beat is spawned in the same tick as the programs
; above and would dispatch an already-overdue periodic task at a port nothing is
; listening on yet. wait_for_api.py always exits 0, hence `;` and not `&&`: beat
; starts either way, and a start it logged as degraded still beats no schedule at
; all. `exec` hands supervisord's stop signal to beat itself; stopasgroup covers
; the wait, whose python3 is a child of this shell rather than the shell.
[program:celery-beat]
command=sh -c 'python3 wait_for_api.py; exec celery -A app.celery beat --scheduler=sqlalchemy --loglevel=info'
directory=/home/sep/app
priority=30
autorestart=true
startsecs=8
startretries=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
