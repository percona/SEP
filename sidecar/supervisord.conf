; Consolidated SEP side-car: the five SEP processes plus the bundled Valkey
; broker under one PID 1. Runs as uid 1001 (sep); sock/pid under /tmp rather
; than the app dir, which holds only read-only shipped files and mounted
; artifact volumes. All program output streams to the container stdout so
; `docker logs` is the single captured stream.

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; --- Broker (starts first) -------------------------------------------------
[program:valkey]
command=valkey-server --port 6379 --bind 127.0.0.1 --maxmemory 256mb --maxmemory-policy noeviction --save "" --appendonly no
priority=5
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; --- Migration one-shots ----------------------------------------------------
; No depends_on in supervisord: each waits for Postgres, runs once, ends EXITED.
; A failed upgrade also ends EXITED (startsecs=0 makes FATAL unreachable), so
; success is published as a sentinel file for healthcheck.sh to assert on.
; Each runs under `sh -c`, so signals go to the process group -- otherwise a
; stop reaches only the wrapper and orphans the wait loop or the upgrade.
[program:migrate-sep]
command=sh -c 'rm -f /tmp/migrate-sep.ok; until nc -z pmm-server 5432; do echo "[migrate-sep] waiting for postgres pmm-server:5432"; sleep 1; done; alembic --name=sep upgrade heads && touch /tmp/migrate-sep.ok'
directory=/home/sep/app
priority=10
startsecs=0
autorestart=false
exitcodes=0
startretries=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:migrate-inventory]
command=sh -c 'rm -f /tmp/migrate-inventory.ok; until nc -z pmm-server 5432; do echo "[migrate-inventory] waiting for postgres pmm-server:5432"; sleep 1; done; alembic --name=inventory upgrade heads && touch /tmp/migrate-inventory.ok'
directory=/home/sep/app
priority=10
startsecs=0
autorestart=false
exitcodes=0
startretries=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:migrate-tasks]
command=sh -c 'rm -f /tmp/migrate-tasks.ok; until nc -z pmm-server 5432; do echo "[migrate-tasks] waiting for postgres pmm-server:5432"; sleep 1; done; alembic --name=tasks upgrade heads && touch /tmp/migrate-tasks.ok'
directory=/home/sep/app
priority=10
startsecs=0
autorestart=false
exitcodes=0
startretries=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; --- API services, tolerate migration/DB lag via autorestart -----------------
; A start that fails before startsecs -- Postgres not up yet, or the migration
; one-shots still running -- spends the startretries budget, and exhausting it
; parks the program in FATAL, which autorestart never revisits. The default of
; 3 is spent in about ten seconds, so it is raised to span a first-run upgrade.
[program:sep]
command=python -m app.sep.main
directory=/home/sep/app
priority=20
autorestart=true
startsecs=8
startretries=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:inventory]
command=python -m app.inventory.main
directory=/home/sep/app
priority=20
autorestart=true
startsecs=8
startretries=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:tasks]
command=python -m app.tasks.main
directory=/home/sep/app
priority=20
autorestart=true
startsecs=8
startretries=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; --- Celery worker + beat ---------------------------------------------------
[program:celery-worker]
command=celery -A app.celery worker --loglevel=info
directory=/home/sep/app
priority=30
autorestart=true
startsecs=8
startretries=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:celery-beat]
command=celery -A app.celery beat --scheduler=sqlalchemy --loglevel=info
directory=/home/sep/app
priority=30
autorestart=true
startsecs=8
startretries=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
