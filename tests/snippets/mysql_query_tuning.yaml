          expected: "profile_cte_force.sql"
          isre: false
        - "{{hostname}}-{{date}}-[0-9][0-9]-[0-9][0-9]-[0-9][0-9].tar.gz"
    notExpected:
      stdout:
      stderr:
      returncode: "!= 0"
      dirs:
      files:
        - "{{hostname}}-{{date}}-[0-9][0-9]-[0-9][0-9]-[0-9][0-9]/results.txt"
    cleanup:
      - "rm -f {{hostname}}-{{date}}-[0-9][0-9]-[0-9][0-9]-[0-9][0-9]/*"
      - "rmdir {{hostname}}-{{date}}-[0-9][0-9]-[0-9][0-9]-[0-9][0-9]"
      - "rm {{hostname}}-{{date}}-[0-9][0-9]-[0-9][0-9]-[0-9][0-9].tar.gz"
  - name: "execute"
    cmd: "mysql_query_tuning.sh"
    args:
      - "--query=SELECT user, host FROM mysql.user;"
      - "-e"
    expected:
      stdout:
      stderr:
      returncode: 0
      dirs:
        - "{{hostname}}-{{date}}-[0-9][0-9]-[0-9][0-9]-[0-9][0-9]"
      files:
        - "{{hostname}}-{{date}}-[0-9][0-9]-[0-9][0-9]-[0-9][0-9]/queries.sql"
        -
          file: "{{hostname}}-{{date}}-[0-9][0-9]-[0-9][0-9]-[0-9][0-9]/results.txt"
