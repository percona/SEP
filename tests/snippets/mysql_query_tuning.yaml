name: mysql_query_tuning
sudo: false
tests:
  - name: "invalid-option"
    cmd: "mysql_query_tuning.sh"
    args:
      - "--invalid-option"
    expected:
      stdout:
        file: "invalid.stdout"
        isre: true
      stderr:
        file: "invalid.stderr"
        isre: false
      returncode: 1
      dirs:
      files:
    notExpected:
      stdout:
      stderr:
      returncode: 0
      dirs:
      files:
    cleanup:
  - name: "arguments mess up"
    cmd: "mysql_query_tuning.sh"
    args:
      - "--query=SELECT user, host FROM user;"
      - "-f"
      - "-D"
      - "mysql"
    expected:
      stdout:
        file: "arg_mess.stdout"
        isre: true
      stderr:
      returncode: 1
      dirs:
      files:
    notExpected:
      stdout:
      stderr:
      returncode: 0
      dirs:
      files:
    cleanup:
  - name: "help"
    cmd: "mysql_query_tuning.sh"
    args:
      - "--help"
    expected:
      stdout:
        file: "help.stdout"
        isre: true
      stderr:
      returncode: 0
      dirs:
      files:
    notExpected:
      stdout:
      stderr:
      returncode: "!= 0"
      dirs:
      files:
    cleanup:
  - name: "default"
    cmd: "mysql_query_tuning.sh"
    args:
      - "--query=SELECT user, host FROM mysql.user;"
    expected:
      stdout:
      stderr:
      returncode: 0
      dirs:
        - "{{hostname}}-{{date}}-[0-9][0-9]-[0-9][0-9]-[0-9][0-9]"
      files:
        - 
          file: "{{hostname}}-{{date}}-[0-9][0-9]-[0-9][0-9]-[0-9][0-9]/queries.sql"
          expected: "default_queries.sql"
          isre: false
        - "{{hostname}}-{{date}}-[0-9][0-9]-[0-9][0-9]-[0-9][0-9].tar.gz"
    notExpected:
      stdout:
      stderr:
      returncode: "!= 0"
      dirs:
      files:
        - "{{hostname}}-{{date}}-[0-9][0-9]-[0-9][0-9]-[0-9][0-9]/results.txt"
    cleanup:
      - "rm -f {{hostname}}-{{date}}-[0-9][0-9]-[0-9][0-9]-[0-9][0-9]/*"
      - "rmdir {{hostname}}-{{date}}-[0-9][0-9]-[0-9][0-9]-[0-9][0-9]"
      - "rm {{hostname}}-{{date}}-[0-9][0-9]-[0-9][0-9]-[0-9][0-9].tar.gz"
  - name: "database"
    cmd: "mysql_query_tuning.sh"
    args:
      - "--query=SELECT user, host FROM user;"
      - "-D"
      - "mysql"
    expected:
      stdout:
      stderr:
      returncode: 0
      dirs:
        - "{{hostname}}-{{date}}-[0-9][0-9]-[0-9][0-9]-[0-9][0-9]"
      files:
        - 
          file: "{{hostname}}-{{date}}-[0-9][0-9]-[0-9][0-9]-[0-9][0-9]/queries.sql"
          expected: "database_queries.sql"
          isre: false
        - "{{hostname}}-{{date}}-[0-9][0-9]-[0-9][0-9]-[0-9][0-9].tar.gz"
    notExpected:
