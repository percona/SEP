      - "rm {{hostname}}-{{date}}-[0-9][0-9]-[0-9][0-9]-[0-9][0-9].tar.gz"
  - name: "profile update"
    cmd: "mysql_query_tuning.sh"
    args:
      - "--query=UPDATE mysql.user SET user='foo' WHERE host='bar';"
      - "-p"
    expected:
      stdout:
      stderr:
        file: "profile_update.stderr"
        isre: false
      returncode: 0
