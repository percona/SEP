  brace-expansion@5.0.6: 5.0.7
  brace-expansion@2.1.0: 2.1.2
  form-data: 4.0.6
  js-yaml@>=4.0.0 <4.3.0: 4.3.0
  undici@^7.0.0: 7.28.0
  ws@8.20.1: 8.21.0
  '@babel/core': 7.29.6
  immutable@<5.1.8: ^5.1.8
