# Trivy exception file for the SEP side-car image.
#
# Trivy does NOT auto-discover this file: DefaultIgnoreFile is ".trivyignore",
# so the YAML form must be passed explicitly:
#
#     trivy image --ignorefile .trivyignore.yaml --severity HIGH,CRITICAL <image>
#
# Every entry carries a reachability argument, not merely "no upstream fix" —
# an unfixed CVE alone is not grounds for an exception. expired_at forces a
# revisit; re-scan and take whatever Debian has since fixed.
#
# Every entry is scoped by `purls` to exactly the packages its statement
# assessed. This is load-bearing, not decoration: matchPURL() returns true
# when the list is empty, so an unscoped entry suppresses its CVE for EVERY
# package — including one where the reachability argument does not hold. The
# constraints carry no version, which matches any version of the named package.

vulnerabilities:
  # --- libsqlite3-0 -----------------------------------------------------------
  - id: CVE-2026-11822
    purls:
      - pkg:deb/debian/libsqlite3-0
    statement: >-
      libsqlite3-0. Arbitrary code execution via crafted FTS5 full-text search
      data, CVSS 7.8 AV:L/AC:L/PR:N/UI:R. Reaching it requires querying an FTS5
      table, and SEP declares none: no model, migration or raw statement in the
      tree creates an FTS5 virtual table, so the vector is absent on every
      engine. The engine is deliberately not the argument here — the baked
      profile points all three services at PostgreSQL, but a deployment can
      still select SQLite by setting DATABASE__ENGINE in the environment or by
      bind-mounting a replacement settings.yaml, so an engine-based exception
      would not hold for every supported configuration. No upstream fix. Remove
      when Debian ships one, or if SEP starts declaring FTS5 tables.
    expired_at: 2027-02-19
  - id: CVE-2026-11824
    purls:
      - pkg:deb/debian/libsqlite3-0
    statement: >-
      libsqlite3-0. Arbitrary code execution and crash via a heap-based buffer
      overflow, CVSS 7.8 AV:L/AC:L/PR:N/UI:R. The local, user-interaction vector
      is opening a crafted database file. Nothing in the tree opens a SQLite
      path taken from request data, an upload or any other caller-supplied
      value; under the SQLite engine the only file opened is the one SEP's own
      migrations create inside the container. This is scoped by that provenance
      rather than by the engine, because CVE-2026-11822's FTS5 argument does not
      apply. No upstream fix. Remove when Debian ships one, or if SEP starts
      opening a SQLite file supplied from outside the container.
    expired_at: 2027-02-19

  # --- ncurses (libtinfo6) ----------------------------------------------------
  - id: CVE-2025-69720
    purls:
      - pkg:deb/debian/libtinfo6
    statement: >-
      libtinfo6. ncurses buffer overflow, CVSS 7.8 AV:L/AC:L/PR:L/UI:R. Local
      vector requiring user interaction with a crafted terminfo entry inside the
      container. libncursesw6, ncurses-base and ncurses-bin were purged from the
      image, so the terminfo database and the tput/clear/infocmp tools are gone;
      libtinfo6 is retained only because bash links it. No upstream fix. Remove
      when Debian ships one.
    expired_at: 2027-02-19

  # --- libacl1 ----------------------------------------------------------------
  - id: CVE-2026-54369
    purls:
      - pkg:deb/debian/libacl1
    statement: >-
      libacl1. Symlink traversal privilege escalation, CVSS 7.1 AV:L/AC:L/PR:L.
      Local vector requiring pre-existing privileges in the container; the image
      runs as the unprivileged sep user. No upstream fix; required by coreutils,
      tar, sed and passwd, so not removable. Remove when Debian ships a fix.
    expired_at: 2027-02-19

  # --- util-linux -------------------------------------------------------------
  # The four entries below share a precondition: each vector is reached through
  # an /etc/fstab entry that authorizes an unprivileged mount. The image ships
  # Debian's unconfigured stub, whose only line is a comment, and it is
  # 644 root:root while every supervisord program runs as the unprivileged sep
  # user -- so writing such an entry needs the root the CVE is meant to obtain.
  # mount(8) and umount(8) ARE setuid here; the argument is the absent fstab
  # authorization, not an absent setuid bit.
  - id: CVE-2026-76642
    purls:
      - pkg:deb/debian/bsdutils
      - pkg:deb/debian/libblkid1
      - pkg:deb/debian/liblastlog2-2
      - pkg:deb/debian/libmount1
      - pkg:deb/debian/libsmartcols1
      - pkg:deb/debian/libuuid1
      - pkg:deb/debian/login
      - pkg:deb/debian/mount
      - pkg:deb/debian/util-linux
    statement: >-
      util-linux. mount(8) runs post-mount hooks without checking the mount
      helper's exit status, so an unprivileged user can clone a filesystem with
      inherited suid bits or change a target inode's ownership, CVSS 8.5
      AV:L/AC:L/PR:L/UI:N. Exploitation needs an fstab entry that both
      authorizes the unprivileged mount and carries X-mount.idmap or
      X-mount.owner; this image's fstab declares no entries at all. No upstream
      fix. Remove when Debian ships one, or if the image starts shipping an
      fstab entry carrying user, users, or any X-mount.* option.
    expired_at: 2027-02-19
  - id: CVE-2026-78408
    purls:
      - pkg:deb/debian/bsdutils
      - pkg:deb/debian/libblkid1
      - pkg:deb/debian/liblastlog2-2
      - pkg:deb/debian/libmount1
      - pkg:deb/debian/libsmartcols1
      - pkg:deb/debian/libuuid1
      - pkg:deb/debian/login
      - pkg:deb/debian/mount
      - pkg:deb/debian/util-linux
    statement: >-
      util-linux. nsenter --join-cgroup leaves a root-opened cgroup.procs
      descriptor open across credential changes and execve, letting a process
      in the target inherit root's ability to migrate and kill host processes,
      CVSS 7.9 AV:L/AC:L/PR:L/UI:R. This one is not gated by fstab: it requires
      a privileged operator to run nsenter --join-cgroup against an
      attacker-controlled target. nsenter ships with util-linux but is invoked
      by nothing in the image -- no Containerfile stage, entrypoint script or
      supervisord program references it -- and no process runs as root to
      invoke it. No upstream fix. Remove when Debian ships one, or if anything
      in the image starts calling nsenter.
    expired_at: 2027-02-19
  - id: CVE-2026-78409
    purls:
      - pkg:deb/debian/bsdutils
      - pkg:deb/debian/libblkid1
      - pkg:deb/debian/liblastlog2-2
      - pkg:deb/debian/libmount1
      - pkg:deb/debian/libsmartcols1
      - pkg:deb/debian/libuuid1
      - pkg:deb/debian/login
      - pkg:deb/debian/mount
      - pkg:deb/debian/util-linux
    statement: >-
      util-linux. X-mount.subdir takes a detached-tree fast path on Linux 6.15+
      and passes the subdirectory to open_tree() with AT_SYMLINK_NOFOLLOW,
      which stops neither intermediate symlink traversal nor escape from the
      newly mounted filesystem, CVSS 7.0 AV:L/AC:H/PR:L/UI:N. The CVE states
      the precondition directly -- a local unprivileged user with an
      fstab-authorized X-mount.subdir entry -- and this image's fstab declares
      no entries. No upstream fix. Remove when Debian ships one, or if the
      image starts shipping an fstab entry using X-mount.subdir.
    expired_at: 2027-02-19
  - id: CVE-2026-78410
    purls:
      - pkg:deb/debian/bsdutils
      - pkg:deb/debian/libblkid1
      - pkg:deb/debian/liblastlog2-2
      - pkg:deb/debian/libmount1
      - pkg:deb/debian/libsmartcols1
      - pkg:deb/debian/libuuid1
      - pkg:deb/debian/login
      - pkg:deb/debian/mount
      - pkg:deb/debian/util-linux
    statement: >-
      util-linux. Restricted bind mounts read the source path from fstab
      without pinning it, so a user who can replace the authorized source or a
      writable ancestor redirects setuid mount(8) at another directory, and an
      accompanying X-mount.owner, X-mount.group or X-mount.mode then has root
      change that inode, CVSS 7.8 AV:L/AC:L/PR:L/UI:N. Both halves start from
      an authorized fstab source; this image's fstab declares none. No upstream
      fix. Remove when Debian ships one, or if the image starts shipping a bind
      mount entry in fstab.
    expired_at: 2027-02-19

  # --- systemd (libsystemd0) ----------------------------------------------------
  - id: CVE-2026-16742
    purls:
      - pkg:deb/debian/libsystemd0
      - pkg:deb/debian/libudev1
    statement: >-
      libsystemd0 and libudev1. Local privilege escalation through arbitrary
      system group
      addition to a logged-in homed-managed user, CVSS 6.7 AV:L/AC:H/PR:L/UI:R.
      The defect is in systemd-homed, which this image does not ship: only the
      libsystemd0 and libudev1 shared libraries are installed, and neither the
      systemd-homed binary nor homectl is present. Trivy reports the CVE
      against both libraries because Debian builds all three from the systemd
      source package. There is also
      no homed-managed user to target -- the image runs supervisord as PID 1,
      not systemd. No upstream fix. Remove when Debian ships one, or if the
      image ever installs systemd-homed.
    expired_at: 2027-02-19
