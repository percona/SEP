ALL:
  SOURCE_HOST: localhost
  SOURCE_PORT: 3306
PURGE_LIST:
- ALIAS: archive_table_to_another
  SOURCE_DB: source_db
  SOURCE_TABLE: source_table
  DEST_TABLE: dest_table
  WHERE: "date < CURDATE() - INTERVAL 6 MONTH"
- ALIAS: archive_table_to_file
  SOURCE_DB: source_db
  SOURCE_TABLE: source_table
  DEST_FILE: /var/log/archive/%Y-%m-%d-%D.%t
  WHERE: "date < CURDATE() - INTERVAL 6 MONTH"
- ALIAS: purge_rows
  SOURCE_DB: source_db
  SOURCE_TABLE: source_table
  USE_INDEX: created_date
  WHERE: "date < CURDATE() - INTERVAL 6 MONTH"
  DELETE_DATA: 1
- ALIAS: drop_swap
  # NOTE: drop_swap uses "CREATE TABLE LIKE...", FKs are not preserved (ensure table doesn't have them)
  SOURCE_DB: source_db
  SOURCE_TABLE: source_table
  SWAP_DROP: 1
- ALIAS: dynamic_tables_sources
  SOURCE_QUERY: "SELECT ..."
  WHERE: "date < CURDATE() - INTERVAL 6 MONTH"
  DEST_FILE: /var/log/archive/%Y-%m-%d-%D.%t
