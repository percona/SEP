---
- hosts: postgresql
  tasks:
  - name: Ensure that `ufw` firewall service is enabled and started
    ansible.builtin.service:
      name: ufw
      enabled: true
      state: started
    become: true

  - name: Ensure that `ufw` firewall allows SSH inbound connections
    community.general.ufw:
      rule: allow
      name: OpenSSH
    become: true

  - name: Ensure that `ufw` firewall allows PostgreSQL inbound connections
    community.general.ufw:
      rule: allow
      port: 5432
      proto: tcp
    become: true

  - name: Ensure that `ufw` firewall is enabled and denies unknown inbound connections by default
    community.general.ufw:
      state: enabled
      default: deny
    become: true

  - name: Reload `ufw` firewall
    community.general.ufw:
      state: reloaded
    become: true

  - name: Install `percona-release`
    ansible.builtin.apt:
      deb: 'https://repo.percona.com/apt/percona-release_latest.{{ ansible_distribution_release }}_all.deb'
    become: true

  - name: Install `psycopg2`
    ansible.builtin.apt:
      name: python3-psycopg2
      state: present
      update_cache: true
    become: true

  - name: Enable Percona Distribution for PostgreSQL repo
    ansible.builtin.command: 'percona-release setup -y ppg17'
    become: true
    changed_when: false

  - name: Install Percona Distribution for PostgreSQL server
    ansible.builtin.apt:
      name: percona-postgresql-17
      state: present
      update_cache: true
    become: true

  - name: Ensure PostgreSQL server service is enabled and started
    ansible.builtin.service:
      name: postgresql
      enabled: true
      state: started

  - name: Configure `postgresql.conf` for `listen_addresses`
    ansible.builtin.lineinfile:
      path: '/etc/postgresql/17/main/postgresql.conf'
      regexp: '^#?listen_addresses ='
      line: "listen_addresses = '*'"
    become: true
    notify: Restart PostgreSQL

  - name: Configure `pg_hba.conf` to allow remote connections
    ansible.builtin.lineinfile:
      path: '/etc/postgresql/17/main/pg_hba.conf'
      line: 'host    all             all             0.0.0.0/0               scram-sha-256'
      insertafter: '# IPv4 local connections:'
    become: true
    notify: Restart PostgreSQL

  - name: Create a user
    community.postgresql.postgresql_user:
      name: nicetrythiswillbeinavault
      password: nic3trythiswillbeinavault2
      role_attr_flags: CREATEDB,CREATEROLE,SUPERUSER
    become: true
    become_user: postgres
    no_log: true

  - name: Create a test database
    community.postgresql.postgresql_db:
      name: 'db1'
      encoding: 'UTF-8'
      owner: nicetrythiswillbeinavault
    become: true
    become_user: postgres
    no_log: true

  handlers:
    - name: Restart PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: restarted
      become: true
...
