---
- hosts: all
  tasks:
  - name: Install `percona-release`
    ansible.builtin.dnf:
      name: 'https://repo.percona.com/yum/percona-release-latest.noarch.rpm'
      state: present
      disable_gpg_check: true
    become: true

  - name: Enable Percona Server for MySQL 8.4 repo
    ansible.builtin.command: 'percona-release setup -y ps84lts'
    become: true
    changed_when: false

  - name: Enable Percona Toolkit repo
    ansible.builtin.command: 'percona-release enable pt'
    become: true
    changed_when: false

  - name: Install Percona Server for MySQL 8.4, Percona Toolkit, PyMySQL
    ansible.builtin.package:
      name:
        - percona-server-server
        - percona-toolkit
        - python3-PyMySQL
      state: present
    become: true

  - name: Ensure MySQL server service is enabled and started
    ansible.builtin.service:
      name: mysqld
      enabled: true
      state: started
    become: true

  - name: Get temporary MySQL root password from log
    ansible.builtin.shell: "grep 'temporary password' /var/log/mysqld.log | awk -F ' ' '{print $(NF)}'"
    register: mysql_temp_root_password
    become: true
    changed_when: false
    no_log: true

  - name: Change MySQL root password
    ansible.builtin.command: mysqladmin -u root --password={{ mysql_temp_root_password.stdout | quote }} password "N!cetrythiswillbeinavault2"

  - name: Create /root/.my.cnf with root password
    ansible.builtin.copy:
     dest: '/root/.my.cnf'
     mode: 0600
     content: |
       [client]
       user=root
       password='N!cetrythiswillbeinavault2'
    become: true
    no_log: true

  - name: Create ~/.my.cnf with root password
    ansible.builtin.copy:
      dest: '{{ ansible_env.HOME }}/.my.cnf'
      mode: 0600
      content: |
        [client]
        user=root
        password='N!cetrythiswillbeinavault2'
    no_log: true

  - name: Remove anonymous MySQL users
    community.mysql.mysql_user:
     name: ''
     host_all: true
     state: absent

  - name: Remove MySQL test database
    community.mysql.mysql_db:
      name: test
      state: absent

  - name: Disallow remote MySQL root login
    community.mysql.mysql_query:
      login_db: mysql
      query: DELETE FROM mysql.user WHERE User='root' AND Host NOT IN ('localhost', '127.0.0.1', '::1')

  - name: Download test DB tarball
    ansible.builtin.get_url:
      url: 'https://github.com/datacharmer/test_db/releases/download/v1.0.7/test_db-1.0.7.tar.gz'
      dest: /tmp
      timeout: 30

  - name: Extract the test DB tarball
    ansible.builtin.unarchive:
      src: "/tmp/{{ 'https://github.com/datacharmer/test_db/releases/download/v1.0.7/test_db-1.0.7.tar.gz' | basename }}"
      dest: /tmp
      mode: u=rwX,g=,o=

  - name: Import test DB
    community.mysql.mysql_db:
      state: import
      name: all
      target: /tmp/test_db/employees.sql
      chdir: /tmp/test_db/

  - name: Remove test DB files
    ansible.builtin.file:
      path: "/tmp/{{ item }}"
      state: absent
    loop:
      - test_db
      - "{{ 'https://github.com/datacharmer/test_db/releases/download/v1.0.7/test_db-1.0.7.tar.gz' | basename }}"

  - name: Create `percona` MySQL user
    community.mysql.mysql_user:
      name: percona
      plugin: caching_sha2_password
      plugin_auth_string: N!cetrythiswillbeinavault2
      host: '%'
      priv: '*.*:ALL,GRANT'
    no_log: true

  handlers:
    - name: Restart MySQL
      ansible.builtin.service:
        name: mysqld
        state: restarted
      become: true
...
