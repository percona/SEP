---
- hosts: all
  tasks:
  - name: Add Percona GPG RPM key
    ansible.builtin.rpm_key:
      key: 'https://repo.percona.com/yum/PERCONA-PACKAGING-KEY'
      state: present
    become: true

  - name: Install `percona-release`
    ansible.builtin.package:
      name: 'https://repo.percona.com/yum/percona-release-latest.noarch.rpm'
      state: present
    become: true

  - name: Enable Percona Server for MySQL 8.4 repo
    ansible.builtin.command: 'percona-release setup -y ps84lts'
    become: true
    changed_when: false

  - name: Install Percona Server for MySQL 8.4
    ansible.builtin.package:
      name: percona-server-server
      state: present
    become: true

  - name: Ensure MySQL server service is enabled and started
    ansible.builtin.service:
      name: mysqld
      enabled: true
      state: started
    become: true

  - name: Get temporary MySQL root password from log
    ansible.builtin.shell: "grep 'temporary password' /var/log/mysqld.log | awk -F ' ' '{print $(NF)}'"
    register: mysql_temp_root_password
    become: true
    changed_when: false
    no_log: true

  - name: Change MySQL root password
    ansible.builtin.command: mysqladmin -u root --password={{ mysql_temp_root_password.stdout | quote }} password "N!cetrythiswillbeinavault2"

  - name: Create ~/.my.cnf with root password
    ansible.builtin.copy:
      dest: '{{ ansible_env.HOME }}/.my.cnf'
      mode: 0600
      content: |
        [client]
        user=root
        password='N!cetrythiswillbeinavault2'
    no_log: true

  - name: Remove anonymous MySQL users
    community.mysql.mysql_user:
     name: ''
     host_all: true
     state: absent

  - name: Remove MySQL test database
    community.mysql.mysql_db:
      name: test
      state: absent

  - name: Disallow remote MySQL root login
    community.mysql.mysql_query:
      login_db: mysql
      query: DELETE FROM mysql.user WHERE User='root' AND Host NOT IN ('localhost', '127.0.0.1', '::1')

  handlers:
    - name: Restart MySQL
      ansible.builtin.service:
        name: mysqld
        state: restarted
      become: true
...
