  #   - name: Download latest `podman-compose` to `~/bin`
  #     ansible.builtin.get_url:
  #       url: https://raw.githubusercontent.com/containers/podman-compose/main/podman_compose.py
  #       dest: '{{ ansible_env.HOME }}/bin/podman-compose'
  #       mode: u=rwx,g=rx,o=
  #       timeout: 30

  - name: Configure `podman` engine to run rootlessly
    block:
    - name: Set `user.max_user_namespaces`
      ansible.posix.sysctl:
        name: user.max_user_namespaces
        value: 100000

    - name: Gather environment settings
      ansible.builtin.setup:
        filter: ansible_env
        gather_subset: min
      when: ansible_env.SUDO_USER is undefined

    - name: Check linger status
      ansible.builtin.stat:
        path: '/var/lib/systemd/linger/{{ ansible_env.SUDO_USER }}'
      register: container_linger_check

    - name: Enable linger
      ansible.builtin.command: loginctl enable-linger '{{ ansible_env.SUDO_USER }}'
      when: not container_linger_check.stat.exists | bool

    - name: Check user mappings
      ansible.builtin.command: podman image ls -q
      changed_when: false
      ignore_errors: true
      register: container_rootless_mapping_check

    - name: Configure user mappings
      ansible.builtin.copy:
        content: '{{ item.user }}:100000:65536'
        dest: '/etc/{{ item.path }}'
        owner: root
        group: root
        mode: u=rw,a=r
      loop:
      - user: '{{ ansible_env.SUDO_USER | mandatory }}'
        path: subuid
      - user: '{{ ansible_env.SUDO_USER | mandatory }}'
        path: subgid
      when: container_rootless_mapping_check.stderr is defined and 'cannot find mappings for user' in container_rootless_mapping_check.stderr
    become: true

  - name: Install PMM & SEP
    block:
    # Without regathering environment settings `ansible_env` stays that of `root`
    # from the previous block despite we already chose not to escalate anymore
    # See GAS-928 for a nasty example of this behavior
    - name: Re-gather environment settings
      ansible.builtin.setup:
        filter: ansible_env
        gather_subset: min

#    # In this playbook, this is temporarily not implemented; Jenkins will do this
#    - name: Download SEP installer
#      ansible.builtin.get_url:
#        url: 'https://xxxxxx'
#        dest: '{{ ansible_env.HOME }}/bin/sep_installer.sh'
#        mode: u=rwx,g=rx,o=
#        timeout: 30

    - name: Run PMM & SEP installer script
      ansible.builtin.shell: '{{ ansible_env.HOME }}/bin/sep_installer.sh'
      environment:
        CONTAINER_ENGINE: podman
        SEP_IMAGE_NAME: '{{ sep_image_name }}'
        SEP_IMAGE_TAG: '{{ sep_image_tag }}'
      register: sep_installer_output

    - name: Display SEP installer script output
      ansible.builtin.debug:
        msg: "{{ sep_installer_output.stdout.split('\n') }}"

    - name: Display SEP installer script `stderr`
      ansible.builtin.debug:
        msg: "{{ sep_installer_output.stderr.split('\n') }}"

    - name: Start SEP stack
      ansible.builtin.command: podman-compose --file /home/percona/sep/compose.yaml --project-name sep start
      register: start_sep_stack

    - name: Display starting SEP stack command output
      ansible.builtin.debug:
        msg: "{{ start_sep_stack.stdout.split('\n') }}"

    - name: Display starting SEP stack command `stderr`
      ansible.builtin.debug:
        msg: "{{ start_sep_stack.stderr.split('\n') }}"
...
