---
- hosts: sep_controller
  tasks:
  - name: Ubuntu `ufw` firewall configuration
    block:
    - name: Ensure that `ufw` firewall service is enabled and started
      ansible.builtin.service:
        name: ufw
        enabled: true
        state: started

    - name: Ensure that `ufw` firewall allows SSH inbound connections
      community.general.ufw:
        rule: allow
        name: OpenSSH

    - name: Ensure that `ufw` firewall allows inbound TCP ports 4647, 8443, 8444, 9999
      community.general.ufw:
        rule: allow
        proto: tcp
        port: '4647,8443,8444,9999'

    - name: Ensure that `ufw` firewall is enabled and denies unknown inbound connections by default
      community.general.ufw:
        state: enabled
        default: deny

    - name: Reload `ufw` firewall
      community.general.ufw:
        state: reloaded
    become: true
    when: ansible_distribution == 'Ubuntu'

  - name: Custom CA cert configuration
    block:
    - name: Create custom CA directory
      ansible.builtin.file:
        path: /usr/local/share/ca-certificates/infra
        state: directory

    - name: Add custom CA certificate
      ansible.builtin.copy:
        dest: /usr/local/share/ca-certificates/infra/ca.crt
        content: '{{ custom_ca_certificate }}'

    - name: Update CA certificates
      ansible.builtin.command: update-ca-certificates
    become: true

  - name: Prepare necessary binaries
    block:
      # Prerequisite for rootless `podman` and `podman-compose`
      - name: Install `dotenv` & `uidmap` from repo
        ansible.builtin.apt:
          name:
            - python3-dotenv
            - uidmap
          state: present
          update_cache: yes

      - name: Ensure `/usr/local/bin` exists
        ansible.builtin.file:
          path: /usr/local/bin
          state: directory

      # Tried putting these binaries to `~/bin` and ensure `~/bin` is in service account's `$PATH`
      # yet SEP installer script at the end can't find them
      # So I have to place them into `/usr/local/bin`
      - name: Download latest `yq` to `/usr/local/bin`
        ansible.builtin.get_url:
          url: https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          dest: /usr/local/bin/yq
          mode: u=rwx,g=rx,o=rx
          timeout: 30

      - name: Download latest `podman-compose` to `/usr/local/bin`
        ansible.builtin.get_url:
          url: https://raw.githubusercontent.com/containers/podman-compose/main/podman_compose.py
          dest: /usr/local/bin/podman-compose
          mode: u=rwx,g=rx,o=rx
          timeout: 30
    become: true

  # - name: Prepare necessary binaries
  #   block:
  #   - name: Create `~/bin`
  #     ansible.builtin.file:
  #       path: '{{ ansible_env.HOME }}/bin'
  #       mode: u=rwX,g=,o=
  #       state: directory

  #   - name: Add `~/bin` to service account's $PATH
  #     ansible.builtin.lineinfile:
  #       path: '{{ ansible_env.HOME }}/.bashrc'
  #       line: 'export PATH="$PATH:$HOME/bin"'
  #       regexp: '^export PATH=.*\$HOME/bin.*'
  #       insertafter: EOF
