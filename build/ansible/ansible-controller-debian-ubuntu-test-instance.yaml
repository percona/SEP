---
- hosts: sep-controller
  tasks:
  - name: Ubuntu `ufw` firewall configuration
    block:
    - name: Ensure that `ufw` firewall service is enabled and started
      ansible.builtin.service:
        name: ufw
        enabled: true
        state: started

    - name: Ensure that `ufw` firewall allows SSH inbound connections
      community.general.ufw:
        rule: allow
        name: OpenSSH

    - name: Ensure that `ufw` firewall allows TCP ports 4647, 8443, 8444, 9999
      community.general.ufw:
        rule: allow
        proto: tcp
        port: '4647,8443,8444,9999'

    - name: Ensure that `ufw` firewall is enabled and denies unknown inbound connections by default
      community.general.ufw:
        state: enabled
        default: deny

    - name: Reload `ufw` firewall
      community.general.ufw:
        state: reloaded
    become: true
    when: ansible_distribution == 'Ubuntu'

  - name: Custom CA cert configuration
    block:
    - name: Create custom CA directory
      ansible.builtin.file:
        path: /usr/local/share/ca-certificates/infra
        state: directory

    # Need to find a way to inject CA cert secret here
    - name: Add custom CA certificate
      ansible.builtin.copy:
        dest: /usr/local/share/ca-certificates/infra/ca.crt
        content: |
          -----BEGIN CERTIFICATE-----
          -----END CERTIFICATE-----

    - name: Update CA certificates
      ansible.builtin.command:
        cmd: update-ca-certificates
    become: true

  # Prerequisite for rootless `podman` and `podman-compose`
  - name: Install `dotenv`
    ansible.builtin.apt:
      name:
        - python3-dotenv
        - uidmap
      state: present
      update_cache: yes
    become: true

  - name: Prepare necessary binaries
    block:
    - name: Create `~/bin`
      ansible.builtin.file:
        path: '{{ ansible_env.HOME }}/bin'
        mode: u=rwX,g=,o=
        state: directory

    - name: Add `~/bin` to service account's $PATH
      ansible.builtin.lineinfile:
        path: '{{ ansible_env.HOME }}/.bashrc'
        line: 'export PATH="$PATH:$HOME/bin"'
        regexp: '^export PATH=.*\$HOME/bin.*'
        insertafter: EOF
        state: present

    - name: Download latest `yq` to `~/bin`
      ansible.builtin.get_url:
        url: https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
        dest: '{{ ansible_env.HOME }}/bin/yq'
        mode: u=rwx,g=rx,o=
        timeout: 30

    - name: Download latest `podman-compose` to `~/bin`
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/containers/podman-compose/main/podman_compose.py
        dest: '{{ ansible_env.HOME }}/bin/podman-compose'
        mode: u=rwx,g=rx,o=
        timeout: 30

