---
#- hosts: sep-controller
- hosts: localhost
  tasks:
  - block:
    - name: Ensure that `ufw` firewall service is enabled and started
      ansible.builtin.service:
        name: ufw
        enabled: true
        state: started

    - name: Ensure that `ufw` firewall allows SSH inbound connections
      community.general.ufw:
        rule: allow
        name: OpenSSH

    - name: Ensure that `ufw` firewall is enabled and denies unknown inbound connections by default
      community.general.ufw:
        state: enabled
        default: deny

    - name: Reload `ufw` firewall
      community.general.ufw:
        state: reloaded
    become: true
    when: ansible_distribution == 'Ubuntu'

  - block:
    - name: Create custom CA directory
      ansible.builtin.file:
        path: /usr/local/share/ca-certificates/infra
        state: directory

    - name: Add custom CA certificate
      ansible.builtin.copy:
        dest: /usr/local/share/ca-certificates/infra/ca.crt
        content: |
          -----BEGIN CERTIFICATE-----
          -----END CERTIFICATE-----

    - name: Update CA certificates
      ansible.builtin.command:
        cmd: update-ca-certificates
    become: true

  - name: Create `~/bin`
    ansible.builtin.file:
      path: '{{ ansible_env.HOME }}/bin'
      mode: u=rwX,g=,o=
      state: directory

  - name: Add `~/bin` to service account's $PATH
    ansible.builtin.lineinfile:
      path: '{{ ansible_env.HOME }}/.bashrc'
      line: 'export PATH="$PATH:$HOME/bin"'
      regexp: '^export PATH=.*\$HOME/bin.*'
      insertafter: EOF
      state: present

  - name: Download latest `yq` to `~/bin`
    ansible.builtin.get_url:
      url: https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
      dest: '{{ ansible_env.HOME }}/bin/yq'
      mode: u=rwx,g=rx,o=
      timeout: 30

  # Need to find a way to store public download URL as secret
  #- name: Download latest `gascan` PEX to `~/bin`
    #ansible.builtin.get_url:
      #url: 'https://xxxxxx/{{ ansible_distribution | lower }}-{{ ansible_distribution_release }}/gascan-py{{ ansible_python.version.major }}.{{ ansible_python.version.minor }}'
      #dest: '{{ ansible_env.HOME }}/bin/gascan'
      #mode: u=rwx,g=rx,o=
      #timeout: 30

  - name: Create `gascan` bundle extraction directory
    ansible.builtin.file:
      path: '{{ ansible_env.HOME }}/gascan-bundle'
      mode: u=rwX,g=,o=
      state: directory

  - name: Extract `gascan` helpers
    ansible.builtin.command:
      cmd: '{{ ansible_env.HOME }}/bin/gascan --extract-bundle --extract-path={{ ansible_env.HOME }}/gascan-bundle'
      creates: '{{ ansible_env.HOME }}/gascan-bundle/onboarding*'

  - name: Create alias for `podman-compose`
    ansible.builtin.lineinfile:
      path: '{{ ansible_env.HOME }}/.bashrc'
      line: 'alias podman-compose="PEX_SCRIPT=podman-compose ansible.pex"'
      regexp: '^alias podman-compose=*'
      insertafter: EOF
      state: present

  - block:
    - name: Ensure `uidmap` is installed
      ansible.builtin.apt:
        name: uidmap
        state: present
        update_cache: true

    - name: Set `user.max_user_namespaces`
      ansible.posix.sysctl:
        name: user.max_user_namespaces
        value: 100000

    - name: Gather environment settings
      ansible.builtin.setup:
        filter: ansible_env
        gather_subset: min
      when: ansible_env.SUDO_USER is undefined

    - name: Check linger status
      ansible.builtin.stat:
        path: '/var/lib/systemd/linger/{{ ansible_env.SUDO_USER }}'
      register: container_linger_check

    - name: Enable linger
      ansible.builtin.command:
        cmd: loginctl enable-linger '{{ ansible_env.SUDO_USER }}'
      when: not container_linger_check.stat.exists | bool

    - name: Check user mappings
      ansible.builtin.command: podman image ls -q
      changed_when: false
      ignore_errors: true
      register: container_rootless_mapping_check

    - name: Configure user mappings
      ansible.builtin.copy:
        content: '{{ item.user }}:100000:65536'
        dest: '/etc/{{ item.path }}'
        owner: root
        group: root
        mode: u=rw,a=r
      loop:
      - user: '{{ ansible_env.SUDO_USER | mandatory }}'
        path: subuid
      - user: '{{ ansible_env.SUDO_USER | mandatory }}'
        path: subgid
      when: container_rootless_mapping_check.stderr is defined and 'cannot find mappings for user' in container_rootless_mapping_check.stderr
    become: true

  # In this playbook, this is temporarily not implemented; Jenkins will do this
  #- name: Download SEP installer
    #ansible.builtin.get_url:
      #url: 'https://xxxxxx'
      #dest: '{{ ansible_env.HOME }}/bin/sep_installer.sh'
      #mode: u=rwx,g=rx,o=
      #timeout: 30

  # Without regathering environment settings `ansible_env` stays that of `root`
  # from the previous block despite we already chose not to escalate anymore
  # See GAS-928 for a nasty example of this behavior
  - block:
    - name: Re-gather environment settings
      ansible.builtin.setup:
        filter: ansible_env
        gather_subset: min

    - name: Install PMM & SEP
      ansible.builtin.shell:
        cmd: '{{ ansible_env.HOME }}/bin/sep_installer.sh'
      environment:
        CONTAINER_ENGINE: podman
        SEP_IMAGE_NAME: labbox-mini.tp.int.percona.com:5555
        SEP_IMAGE_TAG: v0.9.3

  # Bundled `podman-compose` with Debian/Ubuntu is outdated, install updated version using `pip`
#  - name: Install latest `podman-compose` from PyPI
#    ansible.builtin.pip:
#      name: podman-compose
#      state: present
#      virtualenv: '{{ ansible_env.HOME }}/venv'
#      virtualenv_command: '{{ ansible_python.executable }} -m venv'
...
