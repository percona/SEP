# SEP settings TEMPLATE for the PMM feature-build topology. bootstrap.sh
# renders it to settings.yaml (gitignored), filling the __*__ markers from the
# generated .env; compose.yaml mounts the rendered file read-only at
# /home/sep/app/settings.yaml (the side-car bakes FASTAPI_ENV=production_docker,
# so `default` + `production_docker` apply).
#
# Derived from the verified SEP-1578 spike settings, adapted to the feature
# build:
#   - only the three apps shipped in the side-car image are activated (the
#     image does not contain the others; the snippets app is stripped to the
#     non-UI modules atw needs, with builtin snippets ingested at boot);
#   - all three services plus the Celery beat store share the single `sep`
#     database the PMM entrypoint provisions (PMM_ENABLE_SEP exposes exactly
#     `sep`/`sep`; the three Alembic tracks use distinct version tables and
#     their table names do not collide);
#   - the grafana auth block lives in BOTH `default` and `production_docker`
#     because the loader deep-merges `default` into the selected block, and a
#     provider left in `default` would trip the exactly-one-provider check.
#
# glsa_REPLACE_ME placeholders: SEP boots and the PMM UI works without them
# (the nginx overlay injects SEP_INTERNAL_TOKEN); mint-grafana-token.sh
# replaces them to enable SEP-side Grafana auth and the PMM syncer.

default:
  ALLOWED_HOSTS:
    - "*"
  ALLOW_CONCURRENT_SESSIONS: True
  SECRET_KEY: "__SEP_SECRET_KEY__"
  LOGGING: INFO
  SSL_CAFILE: null
  AUTH:
    PROVIDER:
      grafana:
        endpoint: https://pmm-server:8443/graph
        service_account_token: glsa_REPLACE_ME
        session_cookie_name: pmm_session
        verify_ssl: false
  PMM:
    ENDPOINT: https://pmm-server:8443
    VERIFY_SSL: false
    API_KEY: glsa_REPLACE_ME
  SEP:
    SNIPPETS:
      FILTER_EXTENSIONS:
        - .sh
    APPS:
      - MODULE_NAME: inventory
      - MODULE_NAME: atw
      - MODULE_NAME: mysql_backups
    SYNCERS:
      - SYNCER: PMMSyncer
      - SYNCER: MySQLSyncer
        IGNORE_SCHEMAS:
          - sys
          - performance_schema
          - mysql
          - information_schema
      - SYNCER: SystemFactsSyncer

production_docker:
  BASE_URL: http://sep-sidecar:9000 # executors download snippets/scripts from here
  SEP_INTERNAL_TOKEN: __SEP_INTERNAL_TOKEN__
  AUTH:
    PROVIDER:
      grafana:
        endpoint: https://pmm-server:8443/graph
        service_account_token: glsa_REPLACE_ME
        session_cookie_name: pmm_session
        verify_ssl: false
  CELERY:
    BEAT_DBURI: postgresql://sep:__SEP_PG_PASSWORD__@pmm-server:5432/sep
    BROKER_URL: redis://127.0.0.1:6379/0 # superseded by the credentialed URL the entrypoint mints
    RESULT_BACKEND: redis://127.0.0.1:6379/1
    RESULT_EXPIRES: 3600
    WORKER_STATE_DB: celery_worker_state
  DATABASE:
    ENGINE: postgresql
    HOST: pmm-server
    NAME: sep
    PASSWORD: __SEP_PG_PASSWORD__
    PORT: 5432
    USER: sep
  INVENTORY:
    DATABASE:
      ENGINE: postgresql
      HOST: pmm-server
      NAME: sep
      PASSWORD: __SEP_PG_PASSWORD__
      PORT: 5432
      USER: sep
    SSL_CERTFILE: null
    SSL_KEYFILE: null
    UVICORN_HOST: 0.0.0.0
    UVICORN_PORT: 9001
  SEP:
    AMBIENT_SESSION_SSO_ENABLED: true
    DATABASE:
      ENGINE: postgresql
      HOST: pmm-server
      NAME: sep
      PASSWORD: __SEP_PG_PASSWORD__
      PORT: 5432
      USER: sep
    INVENTORY_ENDPOINT: http://127.0.0.1:9001
    TASKS_ENDPOINT: http://127.0.0.1:9002
    UVICORN_HOST: 0.0.0.0
    UVICORN_PORT: 9000
    PROXY_HEADERS: True
    SSL_CERTFILE: null
    SSL_KEYFILE: null
    SESSION:
      COOKIE_NAME: casdoorToken
      SECURE: True
    SESSION_REFRESH:
      COOKIE_NAME: refreshToken
      PATH: /api/oauth
      SECURE: True
      SAMESITE: lax
      MAX_AGE: 604800
  SSL_CAFILE: null
  TASKS:
    DATABASE:
      ENGINE: postgresql
      HOST: pmm-server
      NAME: sep
      PASSWORD: __SEP_PG_PASSWORD__
      PORT: 5432
      USER: sep
    UVICORN_HOST: 0.0.0.0
    UVICORN_PORT: 9002
    NOMAD:
      ENDPOINT: https://admin:admin@pmm-server:8443/nomad
      SECURE: true
      VERIFY_SSL: false
      SSL_CAFILE: null
      SSL_CERTFILE: null
      SSL_KEYFILE: null
    SSL_CERTFILE: null
    SSL_KEYFILE: null
