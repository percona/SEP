{% if tasks %}
<table>
    <thead>
    <tr>
        <th>Name</th>
        <th>Host</th>
        <th>Table</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    {% for mytask in tasks %}
    <tr>
        <td>{{ mytask['name'] }}</td>
        <td>{{ mytask['hostname'] }}</td>
        <td>{{ mytask['table'] }}</td>
        <td class="flex">
            <form id="{{ mytask['name'] }}-send" method="post" action="{{ mytask['name'] }}">
                <button name="location" class="icons">send</button>
            </form>
            <form id="{{ mytask['name'] }}-info" method="get" action="{{ mytask['name'] }}">
                <button class="icons">info</button>
            </form>
            <form id="{{ mytask['name'] }}-delete" method="post" action="{{ mytask['name'] }}/delete">
                <button name="location" class="icons">delete forever</button>
{#                TODO: confirm dialog #}
            </form>
        </td>
    </tr>
    {% endfor %}
    </tbody>
</table>
{% else %}
<p>No data</p>
{% endif %}
