{% if running_tasks %}
<table class="responsive-table">
  <thead>
     <tr>
       <th>Name</th>
       <th>Host</th>
       <th>Start At</th>
       <th>Actions</th>
     </tr>
  </thead>
  <tbody>
     {% for task in running_tasks %}
     {% set task_name = task["name"] %}
     <tr>
       <td>{{ task_name }}</td>
       <td>{{ task['execution_request']['target'] }}</td>
       <td>{{ task['updated_at'] }}</td>
       <td>
         <a href="/alters/{{ task_name }}"><i class="icons">visibility</i></a>
         <!-- TODO <i class="icons">cancel</i>-->
       </td>
     </tr>
     {% endfor %}
  </tbody>
</table>
{% else %}
<p>No data</p>
{% endif %}
