{% from tornado.escape import xhtml_unescape %}
{% set form_class = "modal" if modal_required else "" %}
<form action="" method="post" class="{{ form_class }}">
    <fieldset>
        <legend>Main options</legend>
        <fieldset>
            <legend>Change details</legend>
            <label for="task_name">Task name</label>
            <input type="text" id="task_name" name="task_name" class="validate" />
            <label for="hostname">Select host</label>
            <select id="hostname" name="hostname">
            {% for host in mysql_hosts %}
                <option value="{{ host['address'] }}">{{ host['name'] }}</option>
                {% for svc in host['data']['services'] %}
                    {% if svc['type'] == 'mysql' %}
                    <option value="{{ svc['address'] }}">{{ host['name'] }} - {{ svc['address'] }}</option>
                    {% end %}
                {% end %}
            {% end %}
            </select>
            <label for="run_from">Run from</label>
            <select id="run_from" name="run_from">
                <option value="" selected>Local to DB Host</option>
            {% for host in hosts %}
                <option value="{{ host['address'] }}">{{ host['name'] }}</option>
            {% end %}
            </select>
        </fieldset>
            <fieldset>
                <legend>Data</legend>
                <label for="schema_name">Schema</label>
                <input type="text" id="schema_name" name="schema_name" class="validate" />
                <label for="table_name">Table</label>
                <input type="text" id="table_name" name="table_name" class="validate" />
                <label for="alter">Alter</label>
                <input type="text" id="alter" name="alter" class="validate" />
            </fieldset>
        </fieldset>

    <button type="submit">Create</button>
    <button type="reset">Reset</button>
    {% apply xhtml_unescape %} {{ xsrf_form_html() }} {% end %}
</form>
