{% if pending_tasks %}
<table class="responsive-table">
  <thead>
    <tr>
      <th>Name</th>
      <th>Host</th>
      <th>Created At</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for task in pending_tasks %}
    {% set task_name = task["name"] %}
    <tr>
      <td>{{ task_name }}</td>
      <td>{{ task['execution_request']['target'] }}</td>
      <td>{{ task['created_at'] }}</td>
      <td>
        <a href="{{ task_name }}"><i class="icons">visibility</i></a>
        <a href="javascript:;" onclick="document.getElementById('deleteTaskForm').submit();"><i class="icons">delete forever</i></a>
        <form action="{{ task['name'] }}/delete" method="POST" style="display:none;" id="deleteTaskForm"></form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p>No data</p>
{% endif %}
