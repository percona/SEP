{% extends "base.html" %}
{% block title %}

{% endblock title %}
{% block main %}
<script src="{{ url_for('static', path='/plugins/mum/bundle.js') }}" nonce="{{ request.state.csp_nonce }}"
    defer></script>
<div id="mum"></div>
{% endblock main %}
{% block behaviours_optimized_extra %}
<script src="{{ url_for('static', path='/js/relativeTime.js') }}" nonce="{{ request.state.csp_nonce }}"></script>
{% if history_tasks or running_tasks %}
<script src="{{ url_for('static', path='/js/logs.js') }}" nonce="{{ request.state.csp_nonce }}"></script>
{% endif %}
{% endblock behaviours_optimized_extra %}
