<h2>Create a new task</h2>
<form action="" method="post">
    <fieldset>
        <legend>Enter a new task definition</legend>
        <div>
            <label>Alias
                <input id="taskalias" name="taskalias" maxlength="100" size="20" />
            </label>
        </div>
        <label>Definition
            <textarea id="taskdef" name="taskdef" rows="40" cols="80"></textarea>
        </label>
        <fieldset>
            <legend>Format</legend>
            <label title="Nomad-only">HCL
                <input type="radio" id="format-hcl" name="format" value="hcl" />
            </label>
            <label>JSON
                <input type="radio" id="format-json" name="format" value="json" />
            </label>
            <label>YAML
                <input type="radio" id="format-yaml" name="format" value="yaml" checked />
            </label>
        </fieldset>
        <label>Engine
            <select id="taskeng" name="taskeng">
                {% for backend in available_backends %}
                <option value="{{ backend }}">{{ backend.capitalize() }}</option>
                {% endfor %}
            </select>
        </label>
        <label>Owner
            <select id="owners" name="owners">
                <option value="*">Any</option>
                <option value="archiver">Data Archiver</option>
                <option value="alter">Schema Change</option>
            </select>
        </label>
    </fieldset>
    <button type="submit" title="Add a new task">Create</button>
</form>
