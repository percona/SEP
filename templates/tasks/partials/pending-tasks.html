<div class="tasks-table-container">
    <table class="responsive-table tasks-table">
        <thead>
            <tr>
                <th>Name</th>
                <th>Host</th>
                <th>Created At</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% if pending_tasks %}
                {% for task in pending_tasks %}
                    {% set task_name = task["task"]["name"] %}
                    <tr>
                        <td>{{ task_name }}</td>
                        <td>{{ task['execution_request']['target'] }}</td>
                        <td class="relativeTime">{{ task['created_at'] }}</td>
                        <td>
                            <a href="{{ task_name }}"><i class="icons">visibility</i></a>
                            <a href="#" class="submitNextForm">
                                <i class="icons">delete forever</i></a>
                            <form action="{{ task_path }}/delete"
                                  method="post"
                                  style="display:none"
                                  id="deleteTaskForm">
                            </form>
                        </td>
                    </tr>
                {% endfor %}
            {% else %}
                <tr>
                    <td colspan="4" class="no-tasks">No tasks pending</td>
                </tr>
            {% endif %}
        </tbody>
    </table>
</div>
