{% if pending_tasks %}
<table class="responsive-table">
  <thead>
    <tr>
      <th>Name</th>
      <th>Host</th>
      <th>Created At</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for backup in pending_tasks %}
    {% set backup_name = backup["task"]["name"] %}
    <tr>
      <td>{{ backup_name }}</td>
      <td>{{ backup['execution_request']['target'] }}</td>
      <td>{{ backup['created_at'] }}</td>
      <td>
        <a href="{{ backup_name }}"><i class="icons">visibility</i></a>
        <a href="javascript:;" onclick="document.getElementById('deleteTaskForm').submit();"><i class="icons">delete forever</i></a>
        <form action="{{ backup_name }}/delete" method="POST" style="display:none;" id="deleteTaskForm"></form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p>No data</p>
{% endif %}
