{% block sidebar %}
<nav class="sidebar" id="sep">
    <ul>
        {% if user.is_admin %}
        <li class="casdoor"><a href="{{ casdoor_url }}" target="_blank">Casdoor</a></li>
        {% endif %}
        {% for plugin in plugins %}
        <li class="{{ plugin.css_class }}"><a href="{{ plugin.uri_path }}/">{{ plugin.name }}</a></li>
        {% endfor %}
        {#   TODO: logout route with CSRF post     #}
        <li class="signout">
            <a href="#" class="submitNextForm">Sign out</a>
            <form action="/logout" method="POST" style="display:none;" id="logoutForm">
            </form>
        </li>
    </ul>
</nav>
{% endblock %}
