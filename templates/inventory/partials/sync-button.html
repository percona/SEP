<div style="display: flex; justify-content: space-between; align-items: center;">
    <h2>{{ inventory_table_title }}</h2>
    {% if can_sync %}
    <form action="{{ inventory_sync_route }}" method="post" style="display: inline;">
        <button {% if sync_is_running %}disabled{% endif %}>
            <span class="icons">autorenew</span>
        </button>
    </form>
    {% endif %}
</div>
