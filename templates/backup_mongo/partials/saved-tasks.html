{% if tasks %}
    <table data-table>
        <thead>
            <tr>
                <th style="width: 200px;">Name</th>
                <th style="width: 200px;">Type</th>
                <th style="width: 200px;">Upload</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for task in tasks %}
                <tr id="{{ task.name }}">
                    <td>
                        <a href="{{ url_for('pbm_backups_detail', task_name=task.name) }}">{{ task.name }}</a>
                    </td>
                    <td>{{ task.backup_type }}</td>
                    <td>{{ task.upload }}</td>
                    <td class="options">{% include "tasks/partials/saved-tasks-actions-column.html" %}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
    {% include "tasks/partials/scheduled-execution-dialog.html" %}
{% else %}
    <p>No data</p>
{% endif %}
