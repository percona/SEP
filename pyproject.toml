[tool.poetry]
name = "sep"
version = "0.0.1"
description = "SEP: Services Enablement Platform"
authors = [
    "Ceri Williams <ceri.williams@percona.com>",
    "Max Bubenick <max.bubenick@percona.com>",
    "Yan Orestes <yan.orestes@percona.com>",
]
maintainers = [
    "Ceri Williams <ceri.williams@percona.com>",
    "Max Bubenick <max.bubenick@percona.com>",
    "Yan Orestes <yan.orestes@percona.com>",
]
readme = "README.md"
repository = "https://github.com/percona/SEP"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: FastAPI",
    "Framework :: MkDocs",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed"
]
package-mode = false # TODO: for now

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
aiohttp = "^3.9.4"
fastapi = {version = "^0.115.0", extras = ["standard"]}
idna = "^3.7"
itsdangerous = "^2.1.2"
pydantic = "^2.4.0"
PyYAML = "^6.0.1"
python-multipart = "^0.0.7"
python-nomad = "^2.0.0"
SQLAlchemy = "^2.0.34"
urllib3 = "^2.2.2"
uvicorn = "^0.24.0.post1"
cryptography = "^43.0.1"
pyjwt = "^2.8.0"
yarl = "^1.9.2"
jinja2 = "^3.1.4"
pydantic-settings = "^2.4.0"
email-validator = "^2.2.0"
greenlet = "^3.0.3"
aiosqlite = "^0.20.0"
alembic = "^1.13.2"
sqlmodel = "^0.0.22"
async-lru = "^2.0.4"
python-minifier = "^2.11.2"
starlette = "^0.40.0"

[tool.poetry.group.audit]
optional = true

[tool.poetry.group.audit.dependencies]
ruff = "^0.5.7"
pip-audit = "^2.7.3"
bandit = {extras = ["toml"], version = "^1.7.9"}
poetry-plugin-export = "^1.8.0"


[tool.poetry.group.mysql]
optional = true

[tool.poetry.group.mysql.dependencies]
aiomysql = "^0.2.0"

[tool.poetry.group.postgresql]
optional = true

[tool.poetry.group.postgresql.dependencies]
asyncpg = "^0.29.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.bandit]
exclude_dirs = [
    ".git",
    ".github",
    "build",
    "venv"
]

[tool.isort]
force_sort_within_sections = true
multi_line_output = 3
py_version = 310

[tool.ruff]
exclude = [
    ".git",
    ".github",
    "build",
    "data",
    "docs",
    "etc",
    "scripts",
    "tmp",
    "venv",
    "Makefile",
    "Containerfile",
    "README.md",
    "LICENSE",
    "*/migrations/*"
]

cache-dir = "build/tmp/.ruff_cache"
line-length = 120
indent-width = 4
output-format = "github"
target-version = "py311"

[tool.ruff.lint]
select = ["E", "N", "I", "FLY", "S"]
ignore = ["I001", "N802"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"