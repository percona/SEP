[project]
name = "sep"
description = "SEP: Services Enablement Platform"
license = {file = "LICENSE"}
readme = "README.md"

authors = [
    {name = "Ceri Williams", email = "ceri.williams@percona.com"},
    {name = "Max Bubenick", email = "max.bubenick@percona.com"},
]
maintainers = [
    {name = "Ceri Williams", email = "ceri.williams@percona.com"},
    {name = "Max Bubenick", email = "max.bubenick@percona.com"},
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: FastAPI",
    "Framework :: MkDocs",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed"
]

dependencies = [
    "aiohttp==3.9.4",
    "casdoor==1.17.1",
    "cryptography==42.0.4",
    "databases==0.8.0",
    "databases[aiosqlite]",
    "fastapi==0.109.1",
    "idna==3.7",
    "itsdangerous==2.1.2",
    "pydantic==2.4.0",
    "PyYAML==6.0.1",
    "python-multipart==0.0.7",
    "python-nomad==2.0.0",
    "requests==2.32.0",
    "SQLAlchemy==1.4.51",
    "tornado==6.4.1",
    "urllib3==2.0.7",
    "uvicorn==0.24.0.post1",
    "uvloop==0.18.0"
]

dynamic = [
    "version"
]
requires-python = ">=3.11"

[tool.bandit]
exclude_dirs = [
    ".git",
    ".github",
    "build",
    "src/archive/support_files",
    "src/sass",
    "venv"
]

[tool.isort]
force_sort_within_sections = true
multi_line_output = 3
py_version = 310

[tool.ruff]
exclude = [
    ".git",
    ".github",
    "build",
    "data",
    "docs",
    "etc",
    "scripts",
    "tmp",
    "venv",
    "Makefile",
    "Containerfile",
    "README.md",
    "LICENSE"
]

cache-dir = "build/tmp/.ruff_cache"
line-length = 120
indent-width = 4
output-format = "github"
target-version = "py311"

[tool.ruff.lint]
select = ["E", "N", "C90", "I", "FLY", "S"]
ignore = ["I001"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.mccabe]
max-complexity = 13

[tool.setuptools.dynamic]
version = {attr = "sep.__version__"}
