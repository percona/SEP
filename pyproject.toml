[tool.poetry]
name = "sep"
version = "0.0.1"
description = "SEP: Services Enablement Platform"
authors = [
    "Ceri Williams <ceri.williams@percona.com>",
    "Max Bubenick <max.bubenick@percona.com>",
    "Yan Orestes <yan.orestes@percona.com>",
]
maintainers = [
    "Ceri Williams <ceri.williams@percona.com>",
    "Max Bubenick <max.bubenick@percona.com>",
    "Yan Orestes <yan.orestes@percona.com>",
]
readme = "README.md"
repository = "https://github.com/percona/SEP"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: FastAPI",
    "Framework :: MkDocs",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed"
]
packages = [
    { include = "app" }
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
aiohttp = "^3.9.4"
fastapi = {version = "^0.115.0", extras = ["standard"]}
idna = "^3.7"
itsdangerous = "^2.1.2"
pydantic = "^2.4.0"
PyYAML = "^6.0.1"
python-multipart = "^0.0.7"
python-nomad = "^2.0.0"
SQLAlchemy = "^2.0.34"
urllib3 = "^2.2.2"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
cryptography = "^43.0.1"
pyjwt = "^2.8.0"
yarl = "^1.9.2"
jinja2 = "^3.1.4"
pydantic-settings = "^2.4.0"
email-validator = "^2.2.0"
greenlet = "^3.0.3"
aiosqlite = "^0.20.0"
alembic = "^1.13.2"
sqlmodel = "^0.0.22"
async-lru = "^2.0.4"
python-minifier = "^2.11.2"
starlette = "^0.40.0"
libsass = "^0.23.0"
watchdog = "^5.0.3"

[tool.poetry.group.audit]
optional = true

[tool.poetry.group.audit.dependencies]
ruff = "^0.7.0"
pip-audit = "^2.7.3"
bandit = {extras = ["toml"], version = "^1.7.9"}
poetry-plugin-export = "^1.8.0"


[tool.poetry.group.mysql]
optional = true

[tool.poetry.group.mysql.dependencies]
aiomysql = "^0.2.0"

[tool.poetry.group.postgresql]
optional = true

[tool.poetry.group.postgresql.dependencies]
asyncpg = "^0.29.0"


[tool.poetry.group.dev.dependencies]
pre-commit = "^4.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.bandit]
exclude_dirs = [
    ".git",
    ".github",
    "build",
    "venv"
]

[tool.ruff]
fix = true
show-fixes = true
extend-exclude = [
    ".github",
    "build",
    "data",
    "docs",
    "etc",
    "app/*/migrations/*"
]
cache-dir = "build/tmp/.ruff_cache"
target-version = "py311"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "C90",
    "I",
    "N",
    "D",
    "UP",
    "ANN0",
    "ANN2",
    "ASYNC",
    "S",
    "BLE001",
    "FBT",
    "B",
    "A",
    "COM818",
    "C4",
    "DTZ",
    "T100",
    "EXE",
    "ISC",
    "ICN001",
    "LOG",
    "G",
    "INP001",
    "PIE",
    "T20",
    "PT",
    "Q",
    "RSE102",
    "RET",
    "SLF001",
    "SIM",
    "TID252",
    "TCH",
    "ARG",
    "PTH",
    "TD",
    "FIX",
    "ERA001",
    "PGH",
    "PL",
    "TRY",
    "FLY002",
    "PERF",
    "FURB",
    "RUF",
]
ignore = [
    "E501",
    "D104",
    "D105",
    "D106",
    "D107",
    "D203",
    "D213",
    "ISC001",
    "TCH001",
    "FIX002",
    "TRY003",
    "RUF007",
    "RUF012", # Too much false positives with Pydantic subclasses (https://github.com/astral-sh/ruff/issues/5639)
]
task-tags = ["TODO"]

[tool.ruff.lint.isort]
order-by-type = false

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"sqlalchemy.Enum" = "EnumField"
"sqlmodel.Field" = "SQLField"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"config.py" = [
    "N802",
]
"app/core/config.py" = ["ARG003"]
"payload.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
