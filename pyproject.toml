[project]
name = "sep"
version = "0.9.6"
description = "Percona Services Enablement Platform"
authors = [
    {name = "Ceri Williams", email = "ceri.williams@percona.com"},
    {name = "Max Bubenick", email = "max.bubenick@percona.com"},
    {name = "Peter Addo", email = "peter.addo@percona.com"},
    {name = "Yan Orestes", email = "yan.orestes@percona.com"},
]
maintainers = [
    {name = "Ceri Williams", email = "ceri.williams@percona.com"},
    {name = "Max Bubenick", email = "max.bubenick@percona.com"},
    {name = "Peter Addo", email = "peter.addo@percona.com"},
    {name = "Yan Orestes", email = "yan.orestes@percona.com"},
]
readme = "README.md"
repository = "https://github.com/percona/SEP"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Framework :: MkDocs",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed"
]
requires-python = ">=3.11.9,!=3.12.0,!=3.12.1,!=3.12.2,<3.14"
dependencies = [
    "aiohttp (>=3.13.3,<4.0.0)",
    "uvicorn[standard] (>=0.32.0,<0.33.0)",
    "sqlalchemy-celery-beat (>=0.8.4,<0.9.0)",
    "aioresponses (>=0.7.7,<0.8.0)",
    "itsdangerous (>=2.1.2,<3.0.0)",
    "pydantic (>=2.4.0,<2.10.0)",
    "pyyaml (>=6.0.1,<7.0.0)",
    "python-nomad (>=2.0.0,<3.0.0)",
    "sqlalchemy (>=2.0.34,<3.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "pydantic-settings (>=2.4.0,<3.0.0)",
    "email-validator (>=2.2.0,<3.0.0)",
    "aiosqlite (>=0.20.0,<0.21.0)",
    "alembic (>=1.13.2,<2.0.0)",
    "sqlmodel (>=0.0.22,<0.0.23)",
    "async-lru (>=2.0.4,<3.0.0)",
    "python-minifier (>=2.11.2,<3.0.0)",
    "starlette (>=0.49.3,<0.50.0)",
    "celery (>=5.4.0,<6.0.0)",
    "fastapi-csrf-protect (>=0.3.7,<0.4.0)",
    "fastapi (>=0.120.1,<0.120.3)",
    "httpx (>=0.28.0,<0.29.0)",
    "rich (>=13.9.4,<14.0.0)",
    "pygments (>=2.19.1,<3.0.0)",
    "presidio-analyzer (>=2.2.358,<3.0.0)",
    "presidio-anonymizer (>=2.2.358,<3.0.0)",
    "aiofiles (>=24.1.0,<25.0.0)",
    "typing-extensions (>=4.15.0,<5.0.0)",
    "python-multipart (>=0.0.22,<0.0.23)",
    "zstandard (>=0.25.0,<0.26.0)",
]

[tool.poetry]
packages = [
    { include = "app" }
]

[tool.poetry.group.audit]
optional = true

[tool.poetry.group.audit.dependencies]
pip-audit = "^2.9.0"
bandit = {extras = ["toml"], version = "^1.7.9"}
ruff = "^0.9.4"
djlint = "^1.36.4"
jsbeautifier = "^1.15.1"
cssbeautifier = "^1.15.1"

[tool.poetry.group.mysql]
optional = true

[tool.poetry.group.mysql.dependencies]
aiomysql = "^0.3.0"

[tool.poetry.group.syncmysql]
optional = true

[tool.poetry.group.syncmysql.dependencies]
pymysql = "^1.1.1"
myloginpath = "^0.0.4"

[tool.poetry.group.postgresql]
optional = true

[tool.poetry.group.postgresql.dependencies]
asyncpg = "^0.30.0"

[tool.poetry.group.syncpostgresql]
optional = true

[tool.poetry.group.syncpostgresql.dependencies]
psycopg2-binary = "^2.9.10"

[tool.poetry.group.magic]
optional = true

[tool.poetry.group.magic.dependencies]
python-magic = "^0.4.27"

[tool.poetry.group.redis]
optional = true

[tool.poetry.group.redis.dependencies]
kombu = {extras = ["redis"], version = "^5.5.3"}

[tool.poetry.group.spacy_en_model_sm]
optional = true

[tool.poetry.group.spacy_en_model_sm.dependencies]
en-core-web-sm = {url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"}

[tool.poetry.group.spacy_en_model_md]
optional = true

[tool.poetry.group.spacy_en_model_md.dependencies]
en-core-web-md = {url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl"}

[tool.poetry.group.spacy_en_model_lg]
optional = true

[tool.poetry.group.spacy_en_model_lg.dependencies]
en-core-web-lg = {url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl"}

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.5.1"
pytest = "^8.3.3"
pytest-cov = "^6.0.0"
pytest-mock = "^3.14.0"
faker = "^30.8.2"
polyfactory = "^2.18.0"
pytest-asyncio = "^0.24.0"
pytest-env = "^1.1.5"

[tool.poetry.requires-plugins]
poetry-plugin-export = "^1.9.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.bandit]
exclude_dirs = [
    ".git",
    ".github",
    "build",
    "venv",
    "app/tests/",
]

[tool.ruff]
fix = true
show-fixes = true
extend-exclude = [
    ".github",
    "build",
    "data",
    "docs",
    "etc",
    "app/*/migrations/*",
    "payload.py",
    "payload",
    "*_payload",
]
cache-dir = "build/tmp/.ruff_cache"
target-version = "py311"
force-exclude = true

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "C90",
    "I",
    "N",
    "D",
    "UP",
    "ANN0",
    "ANN2",
    "ASYNC",
    "S",
    "BLE001",
    "FBT",
    "B",
    "A",
    "COM818",
    "C4",
    "DTZ",
    "T100",
    "EXE",
    "ISC",
    "ICN001",
    "LOG",
    "G",
    "INP001",
    "PIE",
    "T20",
    "PT",
    "Q",
    "RSE102",
    "RET",
    "SLF001",
    "SIM",
    "TID252",
    "TC",
    "ARG",
    "PTH",
    "TD",
    "FIX",
    "ERA001",
    "PGH",
    "PL",
    "TRY",
    "FLY002",
    "PERF",
    "FURB",
    "RUF",
]
ignore = [
    "E501",
    "D104",
    "D105",
    "D106",
    "D107",
    "D203",
    "D213",
    "ISC001",
    "TC001",
    "FIX002",
    "TRY003",
    "RUF007",
    "RUF012", # Too much false positives with Pydantic subclasses (https://github.com/astral-sh/ruff/issues/5639)
    "PLR0913",
]
task-tags = ["TODO"]

[tool.ruff.lint.isort]
order-by-type = false

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"sqlalchemy.Enum" = "EnumField"
"sqlmodel.Field" = "SQLField"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"config.py" = [
    "N802",
]
"app/core/config.py" = ["ARG003"]
"app/core/utils/fields.py" = ["TRY004"] # Pydantic validation code should raise ValueError
"celery.py" = ["ARG001"]
"test_*.py" = ["S", "ARG001", "ARG002", "ANN", "SLF001"]
"conftest.py" = ["S", "ARG001", "ARG002"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "syncmysql: require syncmysql dependencies",
]
env = [
    "CASDOOR__CLIENT_ID=test-client-id",
    "CASDOOR__CLIENT_SECRET=test-client-secret",
    'CASDOOR__ALLOWED_ISSUERS=["https://allowed-issuer.com"]',
    'ALLOWED_HOSTS=["testserver", "test"]',
    "SEP__MESSAGES__LEVEL=0",
    "ALLOW_CONCURRENT_SESSIONS=false"
]

[tool.coverage.run]
source = ["app"]
omit = [
    "__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.tox]
env_list = ["3.11", "3.12", "3.13"]

[tool.tox.env_run_base]
allowlist_externals = ["make"]
commands = [["make", "test"]]


[tool.djlint]
profile = "jinja"
ignore = "H021"
