[tool.poetry]
name = "sep"
version = "0.0.1"
description = "SEP: Services Enablement Platform"
authors = [
    "Ceri Williams <ceri.williams@percona.com>",
    "Max Bubenick <max.bubenick@percona.com>",
    "Yan Orestes <yan.orestes@percona.com>",
]
maintainers = [
    "Ceri Williams <ceri.williams@percona.com>",
    "Max Bubenick <max.bubenick@percona.com>",
    "Yan Orestes <yan.orestes@percona.com>",
]
readme = "README.md"
repository = "https://github.com/percona/SEP"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: FastAPI",
    "Framework :: MkDocs",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed"
]
package-mode = false # TODO: for now

[tool.poetry.dependencies]
python = "^3.11"
aiohttp = "^3.9.4"
databases = {version = "^0.8.0", extras = ["aiosqlite"]}
casdoor = "^1.17.1"
fastapi = {extras = ["standard"], version = "^0.112.1"}
idna = "^3.7"
itsdangerous = "^2.1.2"
pydantic = "^2.4.0"
PyYAML = "^6.0.1"
python-multipart = "^0.0.7"
python-nomad = "^2.0.0"
requests = "^2.32.3"
SQLAlchemy = "^1.4.51"
urllib3 = "^2.2.2"
uvicorn = "^0.24.0.post1"
uvloop = "^0.18.0"
cryptography = "^42.0.4"
pyjwt = "^2.8.0"
yarl = "^1.9.2"
jinja2 = "^3.1.4"
pydantic-settings = "^2.4.0"
email-validator = "^2.2.0"
greenlet = "^3.0.3"
python-slugify = {extras = ["unidecode"], version = "^8.0.4"}

[tool.poetry.group.audit]
optional = true

[tool.poetry.group.audit.dependencies]
ruff = "^0.5.7"
pip-tools = "^7.4.1"
pip-audit = "^2.7.3"
bandit = {extras = ["toml"], version = "^1.7.9"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.bandit]
exclude_dirs = [
    ".git",
    ".github",
    "build",
    "src/archive/support_files",
    "src/sass",
    "venv"
]

[tool.isort]
force_sort_within_sections = true
multi_line_output = 3
py_version = 310

[tool.ruff]
exclude = [
    ".git",
    ".github",
    "build",
    "data",
    "docs",
    "etc",
    "scripts",
    "tmp",
    "venv",
    "Makefile",
    "Containerfile",
    "README.md",
    "LICENSE"
]

cache-dir = "build/tmp/.ruff_cache"
line-length = 120
indent-width = 4
output-format = "github"
target-version = "py311"

[tool.ruff.lint]
select = ["E", "N", "C90", "I", "FLY", "S"]
ignore = ["I001"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.mccabe]
max-complexity = 13
