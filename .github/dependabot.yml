version: 2
multi-ecosystem-groups:
  # Bundle pip + pre-commit + npm lint/format tooling.
  linting-stack:
    schedule:
      interval: "weekly"
    labels:
      - "skip-test"
      # CI gate: skip python/frontend/build jobs.
      - "lint-fmt-only"
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "skip-test"
    groups:
      # Bundle all weekly action bumps; pnpm/action-setup alone churns ~1/week.
      actions:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    labels:
      - "skip-test"
    # oxlint/oxfmt ride with the cross-ecosystem linting-stack.
    patterns:
      - "oxlint"
      - "oxfmt"
    multi-ecosystem-group: "linting-stack"
    groups:
      # Storybook core + addons share a release train.
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
      # MUI packages release together on matching versions.
      mui:
        patterns:
          - "@mui/*"
      # Vite core + plugins peer-pin vite version.
      vite-stack:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vite-tsconfig-paths"
          - "vitest"
      # @testing-library/* share core APIs.
      testing-library:
        patterns:
          - "@testing-library/*"
      # @dnd-kit/* ship coupled releases.
      dnd-kit:
        patterns:
          - "@dnd-kit/*"
      # @fontsource/* — bundle weekly font bumps.
      fontsource:
        patterns:
          - "@fontsource/*"
      # Prism syntax-highlighting set + types.
      prismjs-stack:
        patterns:
          - "prismjs"
          - "prism-react-renderer"
          - "react-syntax-highlighter"
          - "@types/prismjs"
          - "@types/react-syntax-highlighter"
    ignore:
      # Majors gated behind manual review (percona-ui peer-deps; Node 20 pin).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Linter/formatter/test minors ship behavior changes — gate behind a ticket.
      - dependency-name: "oxlint"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "oxfmt"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "skip-test"
    patterns:
      - "ruff"
      - "djlint"
      - "jsbeautifier"
      - "cssbeautifier"
    multi-ecosystem-group: "linting-stack"
    groups:
      # fastapi pins starlette; python-multipart and uvicorn move with it.
      fastapi-stack:
        patterns:
          - "fastapi"
          - "starlette"
          - "uvicorn"
          - "python-multipart"
      # Pydantic v2 internals shared by pydantic-settings and sqlmodel.
      pydantic-stack:
        patterns:
          - "pydantic"
          - "pydantic-settings"
          - "sqlmodel"
          - "email-validator"
      # SQLAlchemy core + alembic + the async/sync drivers we ship.
      sqlalchemy-stack:
        patterns:
          - "sqlalchemy"
          - "alembic"
          - "aiosqlite"
          - "asyncpg"
          - "aiomysql"
          - "psycopg2-binary"
          - "pymysql"
          - "sqlalchemy-celery-beat"
      # Celery + broker.
      celery-stack:
        patterns:
          - "celery"
          - "kombu"
      # Presidio analyzer + anonymizer ship coupled.
      presidio:
        patterns:
          - "presidio-*"
      # pytest core + plugins share the hook contract.
      pytest-stack:
        patterns:
          - "pytest"
          - "pytest-*"
      # Local lint/format toolchain — no runtime impact.
      linting-stack:
        patterns:
          - "bandit"
          - "pip-audit"
          - "pre-commit"
    ignore:
      # Majors require coordinated migration — gate behind manual `poetry add` + ticket.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Linter/formatter/test minors ship behavior changes — gate behind a ticket.
      - dependency-name: "ruff"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "djlint"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "bandit"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "jsbeautifier"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "cssbeautifier"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "pytest"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "faker"
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    # Hook revs + Python additional_dependencies (Dependabot tracks both).
    patterns:
      - "astral-sh/ruff-pre-commit"
      - "djlint/djLint"
      - "jsbeautifier"
      - "cssbeautifier"
    multi-ecosystem-group: "linting-stack"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Mirror pip-side minor restrictions.
      - dependency-name: "astral-sh/ruff-pre-commit"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "djlint/djLint"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "jsbeautifier"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "cssbeautifier"
        update-types: ["version-update:semver-minor"]
