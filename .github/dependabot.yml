version: 2
multi-ecosystem-groups:
  # Bundle pip ruff/djlint with their .pre-commit-config.yaml hook revs.
  linting-stack:
    schedule:
      interval: "weekly"
    labels:
      - "skip-test"
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "skip-test"
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    labels:
      - "skip-test"
    groups:
      # Storybook core + addons share a release train.
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
      # MUI packages release together on matching versions.
      mui:
        patterns:
          - "@mui/*"
    ignore:
      # Majors are gated behind manual review: @percona/percona-ui peer-deps
      # hold @mui/* on v7, react-hook-form on v7, and material-react-table
      # on v1; @types/node tracks our Node 20 runtime pin.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "skip-test"
    patterns:
      - "ruff"
      - "djlint"
    multi-ecosystem-group: "linting-stack"
    groups:
      # fastapi pins starlette; python-multipart and uvicorn move with it.
      fastapi-stack:
        patterns:
          - "fastapi"
          - "starlette"
          - "uvicorn"
          - "python-multipart"
      # Pydantic v2 internals shared by pydantic-settings and sqlmodel.
      pydantic-stack:
        patterns:
          - "pydantic"
          - "pydantic-settings"
          - "sqlmodel"
          - "email-validator"
      # SQLAlchemy core + alembic + the async/sync drivers we ship.
      sqlalchemy-stack:
        patterns:
          - "sqlalchemy"
          - "alembic"
          - "aiosqlite"
          - "asyncpg"
          - "aiomysql"
          - "psycopg2-binary"
          - "pymysql"
          - "sqlalchemy-celery-beat"
      # Celery + broker.
      celery-stack:
        patterns:
          - "celery"
          - "kombu"
      # Presidio analyzer + anonymizer ship coupled.
      presidio:
        patterns:
          - "presidio-*"
      # pytest core + plugins share the hook contract.
      pytest-stack:
        patterns:
          - "pytest"
          - "pytest-*"
      # Local lint/format toolchain — no runtime impact.
      linting-stack:
        patterns:
          - "bandit"
          - "jsbeautifier"
          - "cssbeautifier"
          - "pip-audit"
          - "pre-commit"
    ignore:
      # Majors require coordinated migration (Pydantic v1→v2, SQLAlchemy 1→2);
      # gate behind manual `poetry add` + ticket. Security advisories still fire.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # ruff minors ship new lint rules — gate behind a ticket.
      - dependency-name: "ruff"
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    patterns:
      - "astral-sh/ruff-pre-commit"
      - "djlint/djLint"
    multi-ecosystem-group: "linting-stack"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Mirror pip-side ruff minor restriction.
      - dependency-name: "astral-sh/ruff-pre-commit"
        update-types: ["version-update:semver-minor"]
