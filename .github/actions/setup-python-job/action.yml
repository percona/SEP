name: Setup Python job
description: Checkout repo, install Poetry, setup Python
inputs:
  python-version:
    description: Version of Python to use
    required: true
    default: "3.11"
  cache:
    description: Type of cache to use
    required: false
    default: "poetry"

runs:
  using: "composite"
  steps:
    - name: Install poetry
      run: pipx install poetry==2.1.2
      shell: bash
    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: ${{ inputs.cache }}
