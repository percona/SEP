name: Setup Python job
description: Checkout repo, install Poetry, setup Python
inputs:
  python-version:
    description: Version of Python to use
    required: true
    default: "3.11"
runs:
  using: "composite"
  steps:
    - name: Install poetry
      run: pipx install poetry==2.1.2
      shell: bash
    - name: Setup Python
      uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: poetry
