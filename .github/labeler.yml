python:
- any:
  - changed-files:
    - any-glob-to-any-file:
      - '**/**.py'
      - 'pyproject.toml'
      - 'poetry.lock'

frontend:
- any:
  - changed-files:
    - any-glob-to-any-file:
      - 'frontend/**'
      - 'package.json'

skip-test:
- all:
  - changed-files:
    - any-glob-to-all-files:
      - 'CODEOWNERS'
      - 'README.md'
      - '.gitignore'
      - 'dist/**'
- head-branch:
  - '^dependabot/'

# svc:* labels track the mounted services, which share a name with SEP apps but
# are different code. The prefix keeps app/tasks/ (the service) distinct from
# app/sep/apps/tasks/ (the SEP app); same for inventory.
svc:tasks:
- any:
  - changed-files:
    - any-glob-to-any-file:
      - 'app/tasks/**'

svc:inventory:
- any:
  - changed-files:
    - any-glob-to-any-file:
      - 'app/inventory/**'

# BEGIN generated app labels — managed by scripts/sync_labeler_apps.py
# Regenerate with `python scripts/sync_labeler_apps.py`; `--check` fails on drift.
app:alert_troubleshooting:
- any:
  - changed-files:
    - any-glob-to-any-file:
      - 'app/sep/apps/alert_troubleshooting/**'
      - 'frontend/packages/apps/alert_troubleshooting/**'
      - 'tests/app/sep/apps/alert_troubleshooting/**'
      - 'frontend/packages/e2e/tests/alert-troubleshooting*.spec.ts'
