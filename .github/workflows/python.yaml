# Main CI workflow

name: Python

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  POETRY: poetry

jobs:
  bandit:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.11.9"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: ./.github/actions/setup-python-job
        with:
          python-version: ${{ matrix.python }}
      - name: Run bandit
        run: make bandit

  lock_check:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.11.9"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: ./.github/actions/setup-python-job
        with:
          python-version: ${{ matrix.python }}
      - name: Check pyproject.toml/poetry.lock consistency
        run: poetry check --lock --strict

  check_migrations:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.11.9"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: ./.github/actions/setup-python-job
        with:
          python-version: ${{ matrix.python }}
      - name: Check migrations
        run: CASDOOR__CLIENT_SECRET=notatoken CASDOOR__CLIENT_ID=notatoken make checkmigrations

  test-unit:
    name: test-unit (${{ matrix.python }})
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.11.9", "3.12.3", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: ./.github/actions/setup-python-job
        with:
          python-version: ${{ matrix.python }}
          cache: poetry
      - name: Install test dependencies
        run: poetry sync --no-root --with syncmysql
      - name: Run unit lane
        run: make test-unit

  test-integration:
    name: test-integration (${{ matrix.python }})
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.11.9", "3.12.3", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: ./.github/actions/setup-python-job
        with:
          python-version: ${{ matrix.python }}
          cache: poetry
      - name: Install test dependencies
        run: poetry sync --no-root --with syncmysql
      - name: Run integration lane
        run: make test-integration
      - name: Generate coverage comment data
        id: coverage_comment
        if: matrix.python == '3.11.9' && github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@63f52f4fbbffada6e8dee8ec432de7e01df9ba79 # v3.41
        with:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload coverage comment artifact
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt

  test-contract:
    name: test-contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: ./.github/actions/setup-python-job
        with:
          python-version: "3.11.9"
          cache: poetry
      - name: Install test dependencies
        run: poetry sync --no-root --with syncmysql
      # schemathesis is not declared in pyproject.toml yet — the contract
      # lane skips cleanly until milestone M6 of the adoption plan. The lane
      # job runs so the absence of contract tests is visible in CI.
      - name: Run contract lane
        run: make test-contract

  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.11.9"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: ./.github/actions/setup-python-job
        with:
          python-version: ${{ matrix.python }}
      - name: Build package
        run: make build
