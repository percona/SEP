# Main CI workflow

name: Python

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  POETRY: poetry

jobs:
  bandit:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.11.9"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: ./.github/actions/setup-python-job
        with:
          python-version: ${{ matrix.python }}
      - name: Run bandit
        run: make bandit

  lock_check:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.11.9"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: ./.github/actions/setup-python-job
        with:
          python-version: ${{ matrix.python }}
      - name: Check pyproject.toml/poetry.lock consistency
        run: poetry check --lock --strict

  check_migrations:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.11.9"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: ./.github/actions/setup-python-job
        with:
          python-version: ${{ matrix.python }}
      - name: Check migrations
        run: AUTH__PROVIDER__CASDOOR__CLIENT_SECRET=notatoken AUTH__PROVIDER__CASDOOR__CLIENT_ID=notatoken make checkmigrations

  test:
    name: test (${{ matrix.python }})
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.11.9", "3.12.3", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: ./.github/actions/setup-python-job
        with:
          python-version: ${{ matrix.python }}
          cache: poetry
      - name: Install test dependencies
        run: poetry sync --no-root
      - name: Run tests
        run: make test PYTEST_MARKERS='not postgres and not mysql' COV=${{ matrix.python == '3.11.9' && '1' || '0' }}
      - name: Generate coverage comment data
        id: coverage_comment
        if: matrix.python == '3.11.9' && github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@63f52f4fbbffada6e8dee8ec432de7e01df9ba79 # v3.41
        with:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Scaffold conformance check
        run: make startapp-check
      - name: Upload coverage comment artifact
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt

  test_postgres:
    name: test (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sep
          POSTGRES_PASSWORD: sep
          POSTGRES_DB: sep_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      SEP_TEST_POSTGRES_DSN: postgresql+asyncpg://sep:sep@localhost:5432/sep_test
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: ./.github/actions/setup-python-job
        with:
          python-version: "3.11.9"
          cache: poetry
      - name: Install test dependencies
        run: poetry sync --no-root --with postgresql
      - name: Run PostgreSQL tests
        run: make test PYTEST_MARKERS='postgres' PYTEST_WORKERS=0 COV=0

  test_mysql:
    name: test (mysql)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_ROOT_PASSWORD: sep
          MYSQL_DATABASE: sep_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -psep --silent"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      SEP_TEST_MYSQL_DSN: mysql+aiomysql://root:sep@127.0.0.1:3306/sep_test
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: ./.github/actions/setup-python-job
        with:
          python-version: "3.11.9"
          cache: poetry
      - name: Install test dependencies
        run: poetry sync --no-root --with mysql
      - name: Run MySQL tests
        run: make test PYTEST_MARKERS='mysql' PYTEST_WORKERS=0 COV=0

  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.11.9"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: ./.github/actions/setup-python-job
        with:
          python-version: ${{ matrix.python }}
      - name: Build package
        run: make build
