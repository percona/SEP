# Main CI workflow

name: Python

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  POETRY: poetry

jobs:
  bandit:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.11.9"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: ./.github/actions/setup-python-job
        with:
          python-version: ${{ matrix.python }}
      - name: Run bandit
        run: make bandit

  check_migrations:
    needs: [bandit]
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.11.9"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: ./.github/actions/setup-python-job
        with:
          python-version: ${{ matrix.python }}
      - name: Check migrations
        run: CASDOOR__CLIENT_SECRET=notatoken CASDOOR__CLIENT_ID=notatoken make checkmigrations

  test:
    needs: [bandit, check_migrations]
    name: test (${{ matrix.python }})
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.11.9", "3.12.3", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: ./.github/actions/setup-python-job
        with:
          python-version: ${{ matrix.python }}
          cache: ${{ matrix.python == '3.11.9' && 'poetry' || '' }}
      - name: Install test dependencies
        run: poetry install --with syncmysql
      - name: Run tests
        run: make test

  build:
    needs: [bandit, test, check_migrations]
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.11.9"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: ./.github/actions/setup-python-job
        with:
          python-version: ${{ matrix.python }}
      - name: Build package
        run: make build
