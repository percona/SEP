# Main CI workflow

name: CI

on:
  pull_request:
    branches:
    - main
    types:
    - labeled
    - ready_for_review
    - synchronize
    - unlabeled
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  label-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Block merge on disqualifying labels
        if: >-
          contains(github.event.pull_request.labels.*.name, 'do not merge') ||
          contains(github.event.pull_request.labels.*.name, 'qa in progress') ||
          contains(github.event.pull_request.labels.*.name, 'qa failed')
        run: |
          echo "::error::PR is blocked by label. Remove 'do not merge', 'qa in progress', or 'qa failed' to proceed."
          exit 1

      - name: Require QA approval label
        if: >-
          !contains(github.event.pull_request.labels.*.name, 'qa passed') &&
          !contains(github.event.pull_request.labels.*.name, 'skip-test')
        run: |
          echo "::error::PR requires 'qa passed' or 'skip-test' label to merge."
          exit 1

  # Detect changed file types to gate downstream jobs.
  # Patterns are kept in sync with .github/labeler.yml.
  changes:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            python:
              - '**/**.py'
              - 'pyproject.toml'
              - 'poetry.lock'

  precommit:
    if: ${{ github.event.pull_request.draft == false }}
    needs:
      - label-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: ./.github/actions/setup-python-job

      - name: Perform pre-commit checks
        env:
          POETRY: poetry
        run: |
          sudo apt install -qy shellcheck
          make run-pre-commit

  python:
    if: ${{ github.event.pull_request.draft == false && needs.changes.outputs.python == 'true' }}
    uses: ./.github/workflows/python.yaml
    needs:
      - changes

  build:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    needs:
      - changes
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cache buildah layers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.local/share/containers/storage
          key: buildah-${{ hashFiles('Containerfile.base', 'Containerfile', 'poetry.lock') }}
          restore-keys: |
            buildah-

      - name: Prepare environment
        run: |
          sudo apt update -qqy
          sudo apt install -qqy podman buildah
          systemctl --user start podman
          echo "DOCKER_HOST=unix:///run/user/$UID/podman/podman.sock" >> "$GITHUB_ENV"

      - name: Build container image
        env:
          RELEASE_VER: HEAD
        run: |
          buildah build -f Containerfile.base --compress --force-rm --layers --format oci --memory 100M --isolation rootless --tag "sep:builder"
          make pack
          buildah build -f Containerfile --compress --force-rm --layers --format oci --memory 100M --isolation rootless --tag "sep:${RELEASE_VER}"
          podman run --rm --entrypoint /bin/sh --timeout 10 "sep:${RELEASE_VER}" -c 'sleep 3'

  ci-success:
    if: always()
    needs:
      - label-gate
      - changes
      - precommit
      - python
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
