# Main CI workflow

name: CI

on:
  pull_request:
    branches:
    - main
    types:
    - labeled
    - ready_for_review
    - synchronize
    - unlabeled
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  python:
    if: ${{ github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'python') }}
    uses: ./.github/workflows/python.yaml

  build:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    needs:
    - python
    steps:
    - name: Mark as complete
      run: echo Done
