# Main CI workflow

name: CI

on:
  pull_request:
    branches:
    - main
    types:
    - labeled
    - ready_for_review
    - synchronize
    - unlabeled
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  label-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Block merge on disqualifying labels
        if: >-
          contains(github.event.pull_request.labels.*.name, 'do not merge') ||
          contains(github.event.pull_request.labels.*.name, 'qa in progress') ||
          contains(github.event.pull_request.labels.*.name, 'qa failed')
        run: |
          echo "::error::PR is blocked by label. Remove 'do not merge', 'qa in progress', or 'qa failed' to proceed."
          exit 1

      - name: Require QA approval label
        if: >-
          !contains(github.event.pull_request.labels.*.name, 'qa passed') &&
          !contains(github.event.pull_request.labels.*.name, 'skip-test')
        run: |
          echo "::error::PR requires 'qa passed' or 'skip-test' label to merge."
          exit 1

  # Detect changed file types to gate downstream jobs.
  # Patterns are kept in sync with .github/labeler.yml.
  changes:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            python:
              - '**/**.py'
              - 'pyproject.toml'
              - 'poetry.lock'

  precommit:
    if: ${{ github.event.pull_request.draft == false }}
    needs:
      - label-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: ./.github/actions/setup-python-job

      - name: Perform pre-commit checks
        env:
          POETRY: poetry
        run: |
          sudo apt install -qy shellcheck
          make run-pre-commit

  python:
    if: ${{ github.event.pull_request.draft == false && needs.changes.outputs.python == 'true' }}
    uses: ./.github/workflows/python.yaml
    needs:
      - changes

  build:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    needs:
      - python
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@35d5669990ec77242c5a5926b41381a3f26fa947 # v4.0.0

      - name: Build base image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Containerfile.base
          tags: sep:builder
          load: true
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      - name: Prepare app bundle
        run: make pack

      - name: Build app image
        run: >-
          docker build
          --build-context "localhost/sep:builder=docker-image://sep:builder"
          -f Containerfile -t "sep:HEAD" .

      - name: Smoke test
        run: docker run --rm --entrypoint /bin/sh "sep:HEAD" -c 'sleep 3'

  ci-success:
    if: always()
    needs:
      - label-gate
      - changes
      - precommit
      - python
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
