name: Labels

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  autolabel:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5.0.0
...
