name: Labels

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  autolabel:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/labeler@f27b608878404679385c85cfa523b85ccb86e213 # v6.1.0
...
