name: Labels

permissions:
  contents: read
  pull-requests: read

on:
  pull_request_target:
    branches:
      - main
  workflow_dispatch:

jobs:
  autolabel:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      # sync-labels: true removes an app:/svc: label once a force-push means its
      # paths no longer match. Labeler only manages labels defined in its config,
      # so the app-isolated/large-diff labels below are left untouched here.
      - uses: actions/labeler@f27b608878404679385c85cfa523b85ccb86e213 # v6.1.0
        with:
          sync-labels: true
      # large-diff and app-isolated cannot be expressed by actions/labeler: one
      # counts lines, the other is an "all files in one app slice" predicate.
      # Logic lives in .github/scripts/blast-radius/; checkout the base branch
      # only so PR-head code is never executed in this privileged workflow.
      - name: Checkout base branch workflow scripts
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github
      - name: Compute blast-radius labels
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script-path: .github/scripts/blast-radius/apply-labels.js
